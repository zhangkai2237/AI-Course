<g id="fallback" data-pptx-bounds="48 480 1184 84"><text x="48" y="514" font-size="28" fill="#D85C3D">缺依据 → 补资料；引用不符 → 核实；超时 → 重试或人工补核。</text><text x="48" y="551" font-size="20" fill="#617673">输出是可定位的原句、依据、状态与下一步动作；三段审核说明“何时”，混合审核说明“怎样分工”。</text></g>
