<g id="heading" data-pptx-bounds="56 40 1176 108"><text x="56" y="65" font-size="20" font-weight="bold" fill="#2457D6">第二节 · 项目目标 / 2.3 提效判断</text><text x="56" y="126" font-size="48" font-weight="bold" fill="#172C4D">怎样证明审核真的更省力？</text></g>
<g id="three-checks" data-pptx-bounds="56 200 1176 244"><line x1="74" y1="218" x2="950" y2="218" stroke="#D8E0EC" stroke-width="2"/>
<g id="quality"><circle cx="76" cy="218" r="20" fill="#2457D6"/><text x="76" y="225" font-size="20" text-anchor="middle" fill="#FFFFFF">1</text><text x="56" y="279" font-size="28" font-weight="bold" fill="#172C4D">问题和依据可靠吗？</text><text x="56" y="329" font-size="24" fill="#61718A">真实问题有没有漏？<tspan x="56" dy="39">正常表达有没有误报？</tspan><tspan x="56" dy="39">引用资料是否适用？</tspan></text></g>
<g id="combined-effort"><rect x="426" y="200" width="434" height="244" rx="8" fill="#EAF0FB"/><circle cx="454" cy="218" r="20" fill="#2457D6"/><text x="454" y="225" font-size="20" text-anchor="middle" fill="#FFFFFF">2</text><text x="450" y="279" font-size="28" font-weight="bold" fill="#172C4D">双方总投入减少了吗？</text><text x="450" y="329" font-size="24" fill="#172C4D">作者：自检、读反馈、修改</text><text x="450" y="368" font-size="24" fill="#172C4D">审核员：确认、纠错、复核</text><line x1="450" y1="389" x2="836" y2="389" stroke="#D8E0EC"/><text x="450" y="424" font-size="24" font-weight="bold" fill="#2457D6">双方加起来算</text></g>
