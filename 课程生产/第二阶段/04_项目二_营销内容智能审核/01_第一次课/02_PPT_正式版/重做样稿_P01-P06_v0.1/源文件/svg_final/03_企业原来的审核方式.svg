<g id="heading" data-pptx-bounds="56 40 1176 146"><text x="56" y="65" font-size="20" font-weight="bold" fill="#2457D6">第一节 · 业务背景 / 1.1 原有审核方式</text><text x="56" y="126" font-size="48" font-weight="bold" fill="#172C4D">企业原来是怎样审核营销内容的？</text><text x="56" y="174" font-size="28" fill="#61718A">小周按日常计划写P1推广，小林人工阅读，逐句对照业务资料。</text></g>
