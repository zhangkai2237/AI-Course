<g id="heading" data-pptx-bounds="56 40 1176 105"><text x="56" y="65" font-size="20" font-weight="bold" fill="#2457D6">第一节 · 业务背景 / 1.3 人工核对动作</text><text x="56" y="126" font-size="48" font-weight="bold" fill="#172C4D">跟着小林，走一次人工核对</text></g>
<g id="original-copy" data-pptx-bounds="56 175 410 209"><text x="56" y="201" font-size="20" fill="#61718A">待审原句</text><text x="56" y="257" font-size="32" font-weight="bold" fill="#172C4D">“本次活动到手1799元，<tspan x="56" dy="48">人人同价！”</tspan></text><line x1="56" y1="334" x2="430" y2="334" stroke="#EAA45B" stroke-width="4"/><text x="56" y="374" font-size="20" fill="#61718A">要核实：什么人、满足什么条件？</text></g>
<g id="activity-evidence" data-pptx-bounds="500 175 732 224"><rect x="500" y="175" width="732" height="224" rx="8" fill="#EAF0FB"/><text x="524" y="207" font-size="20" fill="#2457D6">当前活动资料 / F-PROMO-01 v1 · 教学给定</text><text x="524" y="254" font-size="28" font-weight="bold" fill="#172C4D">2399元 → 1999元 → 1799元</text><text x="524" y="297" font-size="24" fill="#172C4D">先领取并使用400元活动券，享1999元；<tspan x="524" dy="37">新会员再领取并使用200元专享券，享1799元。</tspan></text><text x="524" y="379" font-size="20" fill="#61718A">仅本次活动适用期内有效。</text></g>
<g id="manual-actions" data-pptx-bounds="56 435 1176 96"><line x1="182" y1="465" x2="1075" y2="465" stroke="#D8E0EC" stroke-width="2"/><g fill="#F7F9FC"><rect x="56" y="444" width="216" height="42"/><rect x="350" y="444" width="252" height="42"/><rect x="674" y="444" width="252" height="42"/><rect x="1012" y="444" width="220" height="42"/></g><g font-size="28" font-weight="bold" fill="#2457D6"><text x="56" y="475">01 读原句</text><text x="350" y="475">02 找当前资料</text><text x="674" y="475">03 核对条件</text><text x="1012" y="475">04 写反馈</text></g><text x="56" y="520" font-size="24" fill="#61718A">读完一句话，还要完成资料定位、条件比对与修改说明。</text></g>
<g id="actionable-feedback" data-pptx-bounds="56 556 1176 108"><rect x="56" y="556" width="6" height="102" fill="#2457D6"/><text x="80" y="585" font-size="20" fill="#2457D6">可执行的审核意见</text><text x="80" y="625" font-size="28" font-weight="bold" fill="#172C4D">补齐新会员资格、两类券的领取与使用条件，删除“人人同价”。</text><text x="80" y="655" font-size="20" fill="#61718A">这里只演示价格核对，不代表其余审核项或整篇已完成。</text></g>
