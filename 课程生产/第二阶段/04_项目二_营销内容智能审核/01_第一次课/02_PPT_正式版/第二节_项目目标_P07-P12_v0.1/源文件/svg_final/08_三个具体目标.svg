<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, PingFang SC, sans-serif" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="heading" data-pptx-bounds="56 40 1176 147"><text x="56" y="65" font-size="20" font-weight="bold" fill="#2457D6">第二节 · 项目目标 / 2.1 工作目标</text><text x="56" y="126" font-size="48" font-weight="bold" fill="#172C4D">把“智能审核”变成三个具体目标</text><text x="56" y="174" font-size="24" fill="#61718A">业务说“做个智能审核”，还要问：谁的工作，具体怎样改善？</text></g>
<g id="goal-evidence" data-pptx-bounds="56 211 1176 124"><circle cx="82" cy="243" r="25" fill="#2457D6"/><text x="82" y="251" font-size="24" text-anchor="middle" fill="#FFFFFF">1</text><text x="136" y="250" font-size="28" font-weight="bold" fill="#172C4D">让适用依据来到待核对的原句旁边</text><text x="136" y="291" font-size="24" fill="#61718A">小林核对1799元时，直接看到本次活动的价格、资格和用券条件。</text><text x="136" y="325" font-size="20" fill="#2457D6">减少查找与定位；依据是否正确、适用，仍需确认。</text></g>
<g id="goal-revision" data-pptx-bounds="56 354 1176 124"><circle cx="82" cy="386" r="25" fill="#2457D6"/><text x="82" y="394" font-size="24" text-anchor="middle" fill="#FFFFFF">2</text><text x="136" y="393" font-size="28" font-weight="bold" fill="#172C4D">让意见更具体，让修改与复核接得上</text><text x="136" y="434" font-size="24" fill="#61718A">说清新会员与两类券条件；新稿能对照旧意见，也能看见其他改动。</text><text x="136" y="468" font-size="20" fill="#2457D6">减少作者与审核员反复解释，以及复核时重新拼接信息。</text></g>
<g id="goal-inspection" data-pptx-bounds="56 497 1176 124"><circle cx="82" cy="529" r="25" fill="#2457D6"/><text x="82" y="537" font-size="24" text-anchor="middle" fill="#FFFFFF">3</text><text x="136" y="536" font-size="28" font-weight="bold" fill="#172C4D">条件变化后，找对需要复查的在用内容</text><text x="136" y="577" font-size="24" fill="#61718A">赠品条件变了，按本次活动、使用状态和内容表达确认范围，交负责人处理。</text><text x="136" y="611" font-size="20" fill="#2457D6">减少范围定位和找维护人的劳动，让后续处理有人承接。</text></g>
<g id="claim-boundary" data-pptx-bounds="56 635 1176 30"><text x="56" y="657" font-size="20" fill="#61718A">这些是首版期望改善，是否真正省力，要通过试用验证。</text></g>
