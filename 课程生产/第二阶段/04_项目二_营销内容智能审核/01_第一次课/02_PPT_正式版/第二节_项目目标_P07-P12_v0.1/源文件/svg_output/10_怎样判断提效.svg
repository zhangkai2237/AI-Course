<g id="evaluation-plan" data-pptx-bounds="56 484 1176 178"><text x="56" y="513" font-size="28" font-weight="bold" fill="#2457D6">工具出结果快，只是一个局部。</text><text x="56" y="560" font-size="24" fill="#172C4D">先记录原有流程，再用可比任务做小范围对照。</text><text x="56" y="601" font-size="20" fill="#61718A">等待业务回复时间另记；同时平衡任务难度与人员熟悉程度。</text><text x="56" y="648" font-size="20" fill="#61718A">没有业务基线，先收集证据，不承诺固定节省比例或通用准确率门槛。</text></g>
