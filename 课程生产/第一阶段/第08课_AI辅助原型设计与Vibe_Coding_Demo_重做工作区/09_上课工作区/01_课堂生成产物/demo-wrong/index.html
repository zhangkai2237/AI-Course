<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>错误示范Demo｜对比功能越界版</title>
  <style>
    :root{--red:#e1251b;--ink:#1f2329;--sub:#777f8c;--bg:#f5f6fa;--line:#edf0f5;--purple:#7c3aed;--green:#10a568;--orange:#ff7a00;--shadow:0 8px 24px rgba(20,24,35,.10)}*{box-sizing:border-box}body{margin:0;background:#d9dde5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink)}button{font:inherit}.device{width:min(430px,100vw);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 18px 60px rgba(0,0,0,.18);position:relative;overflow:hidden}.status{height:28px;background:#f5f6fa;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.screen{height:calc(100vh - 28px);overflow:auto;padding-bottom:86px}.head{position:sticky;top:0;z-index:30;background:#f5f6fa;padding:10px 12px 8px;border-bottom:1px solid #eef0f4}.search{display:flex;align-items:center;gap:10px}.back{border:0;background:transparent;font-size:28px}.box{height:38px;flex:1;border:1px solid #f2b5bd;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 11px}.box span:first-child{background:#f2f3f5;border-radius:8px;padding:5px 9px}.nav{display:flex;justify-content:space-around;padding:14px 4px 8px;font-size:17px}.nav .on{color:var(--red);font-weight:900;border-bottom:3px solid var(--red);padding-bottom:7px}.wrong-hero{margin:10px;background:linear-gradient(135deg,#7c3aed,#e1251b);color:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}.wrong-hero h1{margin:0 0 8px;font-size:21px}.wrong-hero p{margin:0;font-size:13px;line-height:1.45}.wrong-hero button{margin-top:10px;border:0;background:#fff;color:#e1251b;border-radius:999px;padding:9px 13px;font-weight:900}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badges span{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 7px;font-size:11px}.sort{background:#fff;margin:0 10px;border-radius:16px 16px 0 0}.sort-top{display:flex;align-items:center;justify-content:space-around;height:46px}.filters{display:flex;gap:8px;overflow:auto;padding:0 10px 10px}.filter{white-space:nowrap;background:#f7f8fb;border:0;border-radius:9px;padding:8px 12px;font-size:13px}.filter.ai{background:#f5f3ff;color:#7c3aed;font-weight:900}.coupon{margin:0 10px 8px;background:#fff2f4;color:var(--red);border-radius:0 0 10px 10px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.list{background:#fff;margin:0 10px;border-radius:14px;overflow:hidden}.item{display:grid;grid-template-columns:128px 1fr;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);position:relative}.img{width:128px;height:128px;border-radius:10px;background:#f5f6fa;position:relative;overflow:hidden;border:1px solid #f0f1f5}.phone-stage{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff,#e8ebf0)}.phone{width:46px;height:78px;border-radius:14px;background:linear-gradient(145deg,#111827,#64748b);box-shadow:0 8px 18px rgba(0,0,0,.18)}.phone.b{background:linear-gradient(145deg,#dbeafe,#475569)}.phone.c{background:linear-gradient(145deg,#0f766e,#111827)}.phone.t{background:linear-gradient(145deg,#94a3b8,#111827);width:62px;height:84px}.ribbon{position:absolute;right:0;top:0;background:var(--red);color:#fff;border-radius:0 10px 0 8px;padding:4px 7px;font-size:12px;font-weight:900}.info{min-width:0}.title{font-size:16px;font-weight:760;line-height:1.35}.label{display:inline-block;background:var(--red);color:#fff;border-radius:3px;padding:2px 4px;font-size:11px;margin-right:4px}.meta{font-size:12px;color:#8a8f99;margin-top:6px;line-height:1.45}.price{color:var(--red);font-size:22px;font-weight:950;margin-top:8px}.price small{font-size:13px;color:#8a8f99;text-decoration:line-through;margin-left:5px}.benefits{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.benefits span{font-size:12px;color:#0f9f6e;background:#ecfdf3;border-radius:4px;padding:2px 4px}.benefits span.bad{background:#f5f3ff;color:#7c3aed}.wrong-actions{display:flex;gap:6px;margin-top:9px}.wrong-actions button{border:0;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:900}.compare-main{background:var(--red);color:#fff}.ai-btn{background:#f5f3ff;color:#7c3aed}.float-panel{position:fixed;left:50%;transform:translateX(-50%);bottom:60px;width:min(430px,100vw);z-index:55;background:rgba(255,255,255,.98);border-top:1px solid var(--line);box-shadow:0 -10px 26px rgba(0,0,0,.12);padding:10px}.float-panel h3{margin:0;font-size:15px}.float-panel p{margin:5px 0 8px;color:#666;font-size:12px}.float-panel button{width:100%;border:0;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#e1251b);color:#fff;padding:11px;font-weight:900}.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100vw);height:60px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:36}.tabbar div{text-align:center;font-size:11px}.tabbar b{display:block;font-size:24px;line-height:1}.compare-page{display:none;background:#f5f6fa;min-height:100vh;padding-bottom:20px}.compare-page.on{display:block}.compare-head{position:sticky;top:0;background:#fff;z-index:45;border-bottom:1px solid var(--line);padding:12px}.compare-head h2{margin:0;font-size:18px}.ai-result{margin:10px;background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6;border-radius:14px;padding:12px}.ai-result h3{margin:0 0 6px}.table{margin:10px;background:#fff;border-radius:14px;overflow:auto;border:1px solid var(--line)}.tr{display:grid;grid-template-columns:88px repeat(4,132px);min-width:616px;border-bottom:1px solid var(--line)}.tr:last-child{border-bottom:0}.td{padding:10px 8px;border-right:1px solid var(--line);font-size:12px;line-height:1.45}.td.f{position:sticky;left:0;background:#fbfcfe;font-weight:900}.win{background:#dcfce7}.bad-cell{background:#fef2f2;color:#991b1b}.toast{position:fixed;left:50%;bottom:154px;transform:translateX(-50%);width:min(390px,calc(100vw - 28px));background:#111827;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;z-index:90;display:none}.toast.show{display:block}</style>
</head>
<body>
  <main class="device">
    <div class="status"><span>17:43</span><span>HD 5G WiFi</span><span>89%</span></div>
    <section id="searchPage">
      <div class="screen">
        <header class="head"><div class="search"><button class="back">‹</button><div class="box"><span>手机 ×</span><span>▣ AI</span></div><div style="font-size:26px">⌘</div></div><div class="nav"><span class="on">全部</span><span>新品</span><span>秒送</span><span>店铺</span><span>直播</span></div></header>
        <section class="wrong-hero"><h1>AI智能对比助手</h1><p>错误示范：AI把“商品对比”做成了强入口、大功能，并默认给出购买结论。</p><div class="badges"><span>默认全选</span><span>跨品类</span><span>云端保存</span><span>统一到手价</span><span>AI推荐</span></div><button onclick="openCompare()">立即AI对比并推荐最佳商品</button></section>
        <section class="sort"><div class="sort-top"><span>📍 欧美金融城…</span><b>综合推荐⌄</b><span>销量</span><span>筛选⌁</span></div><div class="filters"><button class="filter">七夕节</button><button class="filter">京东物流</button><button class="filter">国家补贴</button><button class="filter ai">AI帮我选最优</button></div></section>
        <div class="coupon"><span><b>¥7</b> 无门槛·立减，仅可购买部分手机商品</span><button>筛选商品</button></div>
        <section class="list" id="list"></section>
      </div>
      <div class="float-panel"><h3>AI已为你自动选择4件商品</h3><p>包含手机和平板，已同步到云端历史，并生成最佳购买建议。</p><button onclick="openCompare()">查看AI推荐结论</button></div>
      <nav class="tabbar"><div><b>⌂</b>首页</div><div><b>💬</b>消息</div><div><b>🛒</b>购物车</div><div><b>☺</b>我的</div></nav>
    </section>
    <section id="comparePage" class="compare-page"><header class="compare-head"><button class="back" onclick="back()">‹</button><h2>AI商品对比结论</h2></header><div class="ai-result"><h3>AI推荐：直接买小米15</h3><p>系统已综合价格、参数、品牌、人群口碑和个人偏好，自动判断小米15最值得购买。该结论可直接用于下单。</p></div><div class="table" id="table"></div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    const products=[
      ['vivo X300','手机','4119','4999','5000mAh','80W','IP68'],
      ['小米15','手机','3119','3199','5100mAh','100W','IP68'],
      ['REDMI K100 Pro Max','手机','5119','5199','AI补全：5200mAh','AI补全：120W','IP65'],
      ['测试平板 Tab','平板','2799','2999','8800mAh','45W','暂无数据']
    ];
    function toast(t){const el=document.getElementById('toast');el.textContent=t;el.className='toast show';setTimeout(()=>el.className='toast',2600)}
    function render(){document.getElementById('list').innerHTML=products.map((p,i)=>`<article class="item"><div class="img"><span class="ribbon">已默认对比</span><div class="phone-stage"><div class="phone ${i==1?'b':i==2?'c':i==3?'t':''}"></div></div></div><div class="info"><div class="title"><span class="label">自营</span>${p[0]}</div><div class="meta">100万+人浏览｜AI已纳入对比池</div><div class="price">¥${p[2]} 统一到手价 <small>¥${p[3]}</small></div><div class="benefits"><span>政府补贴</span><span class="bad">AI推荐</span><span class="bad">云端保存</span></div><div class="wrong-actions"><button class="compare-main" onclick="toast('错误点：对比入口过强，且默认加入。')">已默认对比</button><button class="ai-btn" onclick="openCompare()">AI结论</button></div></div></article>`).join('')}
    function openCompare(){document.getElementById('searchPage').style.display='none';document.getElementById('comparePage').className='compare-page on';document.documentElement.style.setProperty('--cols',4);document.getElementById('table').innerHTML=[['品类',...products.map(p=>p[1])],['统一到手价',...products.map(p=>'¥'+p[2])],['电池容量',...products.map(p=>p[4])],['充电功率',...products.map(p=>p[5])],['AI结论','不推荐','最推荐','备选','可跨品类参考']].map(r=>`<div class="tr"><div class="td f">${r[0]}</div>${r.slice(1).map((v,i)=>`<div class="td ${i==1?'win':''} ${String(v).includes('AI补全')?'bad-cell':''}">${v}</div>`).join('')}</div>`).join('')}
    function back(){document.getElementById('comparePage').className='compare-page';document.getElementById('searchPage').style.display='block'}
    render();
  </script>
</body>
</html>
