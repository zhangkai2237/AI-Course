<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, PingFang SC, sans-serif" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC" />
<g id="heading" data-pptx-bounds="56 40 1176 108"><text x="56" y="65" font-size="20" font-weight="bold" fill="#2457D6">第二节 · 项目目标 / 2.2 首版范围与责任</text><text x="56" y="126" font-size="48" font-weight="bold" fill="#172C4D">第一版做到哪里，谁来负责？</text></g>
<g id="pilot-scope" data-pptx-bounds="56 180 744 358"><rect x="56" y="180" width="744" height="358" rx="8" fill="#EAF0FB" /><text x="80" y="216" font-size="24" fill="#2457D6">首版覆盖 / 先选P1及少量资料齐全的商品</text><text x="80" y="265" font-size="28" font-weight="bold" fill="#172C4D">每份文案文本，绑定单SKU与活动</text><text x="80" y="307" font-size="24" fill="#172C4D">核对功能事实、价格赠品条件、配送依据</text><line x1="170" y1="379" x2="680" y2="379" stroke="#2457D6" stroke-width="2" /><g fill="#FFFFFF"><rect x="80" y="348" width="202" height="62" rx="6" /><rect x="315" y="348" width="202" height="62" rx="6" /><rect x="550" y="348" width="226" height="62" rx="6" /></g><g font-size="28" font-weight="bold" text-anchor="middle" fill="#172C4D"><text x="181" y="389">事前自检</text><text x="416" y="389">正式审核</text><text x="663" y="389">人工发起巡检</text></g><text x="80" y="449" font-size="20" fill="#61718A">负责人选范围发起巡检；先做深正式审核，再接自检与巡检。</text><text x="80" y="497" font-size="24" fill="#172C4D">系统辅助定位问题、展示依据，衔接修改复核与处理。</text></g>
<g id="human-authority" data-pptx-bounds="842 180 390 358"><text x="842" y="216" font-size="24" fill="#2457D6">人工保留的责任</text><line x1="842" y1="234" x2="1232" y2="234" stroke="#D8E0EC" /><text x="842" y="278" font-size="28" font-weight="bold" fill="#172C4D">正式审核决定</text><text x="842" y="318" font-size="24" fill="#61718A">由审核员作出</text><text x="842" y="374" font-size="28" font-weight="bold" fill="#172C4D">修改、暂停等内容处置</text><text x="842" y="414" font-size="24" fill="#61718A">由内容负责人确认</text><text font-size="20" fill="#172C4D" x="842" y="474">缺资料、执行失败或有争议，</text><text font-size="20" fill="#172C4D" x="842" y="507">交对应责任人确认。</text></g>
<g id="readiness-and-limit" data-pptx-bounds="56 563 1176 103"><line x1="56" y1="563" x2="1232" y2="563" stroke="#D8E0EC" /><text x="56" y="598" font-size="24" fill="#172C4D">前提：业务负责人确认适用资料；文案关联商品、活动、版本和使用状态。</text><text x="56" y="631" font-size="20" fill="#61718A">资料或关联不齐，先补齐或缩小试用范围。</text><text x="56" y="660" font-size="20" fill="#2457D6">系统未发现已覆盖项的问题，仍不代表整篇审核完成。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="56 676 1176 24"><text x="56" y="694" font-size="14" fill="#61718A">教学模拟 / 对应完整版讲义第二节：首版范围与责任</text><text x="1232" y="694" font-size="14" text-anchor="end" fill="#61718A">09</text></g></svg>