<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F7F8F4"/>
<g id="header" data-pptx-bounds="48 32 1184 120"><text x="48" y="62" font-size="20" fill="#126B63">第三篇·验落地 / 第7章小结</text><text x="48" y="125" font-size="42" font-weight="bold" fill="#17302F">产物⑦：一页实施与验证安排</text></g>
<g id="implementation" data-pptx-bounds="48 180 1184 370"><rect x="48" y="180" width="1184" height="370" rx="12" fill="#FFFFFF"/><text x="76" y="224" font-size="24" fill="#126B63">教学示例 / 从R01温度对象核对开始，把七章串成一条路径</text><g font-size="28" fill="#17302F"><text x="76" y="280">先做：有效资料 → 检查可用 → 正式审核闭环 → 自检与巡检复用。</text><text x="76" y="350">谁负责：业务确认依据，产品组织路径，审核与内容负责人承接。</text><text x="76" y="420">依赖：正文、SKU与活动、资料版本、内容关联和维护人。</text><text x="76" y="490">验什么：正常、问题、边界、失败样例；版本与处置；总人工投入。</text></g><text x="76" y="532" font-size="20" fill="#617673">例如：基站65℃洗拖布 / 65℃直接拖地 / 65℃深度清洁 / 资料缺失或执行超时。</text></g>
<g id="decision" data-pptx-bounds="48 585 1184 63"><rect x="48" y="585" width="1184" height="63" rx="12" fill="#126B63"/><text x="76" y="626" font-size="28" fill="#FFFFFF">质量、流程、承接与收益证据稳定后再扩；有问题先定位、修复或缩范围。</text></g><text id="chapter-footer" data-pptx-role="footer" x="48" y="691" font-size="14" fill="#617673">全课回收：为什么做 → 具体怎样做 → 怎样证明有效</text><text id="page" data-pptx-role="page-number" x="1232" y="691" text-anchor="end" font-size="14" fill="#617673">68 / 70</text></svg>
