function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-body">${html}</div>`;if(!m.open)m.showModal();}

function ask(title,description,handler,initial=''){modalHandler=handler;openModal(`<div class="modal-head"><h2>${e(title)}</h2>${btn('关闭','close-modal','subtle')}</div><p class="muted small">${e(description)}</p><label class="field">处理说明<textarea id="modal-note" class="reviewcomment" style="margin-top:8px" placeholder="说明依据和处理理由，至少4个字">${e(initial)}</textarea></label><div class="actions" style="justify-content:flex-end;margin-top:18px">${btn('取消','close-modal')}${btn('确认并留痕','modal-save','primary')}</div>`);document.getElementById('modal-note').focus();}
const evidence={product:'F-PROD-01 v1：最高12000Pa；65℃对应基站热水洗拖布；清扫前收好电线、袜子等小件。',price:'F-PROMO-01 v1：2399元，领用400元活动券后1999元，新会员另领用200元专享券后1799元。',gift:'F-GIFT-01 v1：购买本次活动P1标准版并支付成功，按系统确认顺序，前200名每单赠一份，赠完即止。',ship:'F-SHIP-01 v1：到货时间需结合地址、库存和下单时间确认。',event:'E-GIFT-01：活动负责人已确认名额用完，当前推广不再承诺赠送。已取得资格订单的权益不因此被撤销。'};
function issue(code,type,title,quote,detail,ref){return {code,type,title,quote,detail,ref};}
function compute(v,r){let items=[];let done=5;const text=v.text;
  if(v.preset==='custom')return {status:'partial',coverage:false,done:0,total:5,items:[issue('coverage','unknown','自由稿件超出演示覆盖','','原型只演示预设案例，没有调用模型；不能据此对自由文本作完整审核判断。','')]};
  if(v.preset==='initial')items.push(issue('feature','mismatch','功能对象与资料不一致','65℃热水直接拖地','65℃被用于描述地面拖洗，给定资料对应基站洗拖布。','product'),issue('price','condition','价格缺少资格与用券条件','本次活动到手1799元，人人同价','1799元只适用于给定新会员与两类券路径，人人同价扩大范围。','price'),issue('gift','condition','赠品条件不完整','下单就送宠物清洁包','缺少购买、支付顺序、限量与每单数量等条件。','gift'),issue('avoid','unknown','全面避障承诺缺乏支持','电线袜子都能自动躲开','现有资料提示提前清理这些小件，不能支持全面承诺。','product'),issue('ship','unknown','到达时间缺少确认条件','明天送到家','当前没有地址、库存与下单时间，交履约负责人确认。','ship'));
  if(v.preset==='partial')items.push(issue('price','condition','领券1799元仍缺条件','本次活动领券到手1799元','尚未交代新会员资格及两类券的领用条件。','price'));
  if(r.giftEnded&&['correct','partial'].includes(v.preset))items.push(issue('gift','mismatch','当前赠品权益已经变化','前200名赠宠物清洁包','负责人确认名额用完，需结合当前使用情况更新或说明。','event'));
  if(!r.giftEnded&&v.preset==='updated')items.push(issue('gift','unknown','当前尚无名额用完的确认','赠品名额已用完','需由活动负责人确认权益状态后再采用该表述。','gift'));
  if(r.kind==='巡检'){items=items.filter(i=>i.code==='gift');done=1;}
  let status='done';
  if(r.fault==='missing'){items=items.filter(i=>!['price','gift'].includes(i.code));items.push(issue('missing','execution','活动资料暂时不可用','','价格与赠品缺少有效依据，相关范围未可靠完成。',''));status='partial';done=r.kind==='巡检'?0:3;}
  if(r.fault==='timeout'&&r.kind!=='巡检'){items=items.filter(i=>i.code!=='feature');items.push(issue('timeout','execution','功能检查超时','','其他检查保留；可重试或由审核人员记录人工补核。','product'));status='partial';done=4;}
  if(r.fault==='quote'){items.push(issue('quote','execution','原文位置校验未通过','','预设异常：返回引文不属于本版正文，不能直接采信。',''));status='partial';done=Math.max(0,done-1);}
  for(const i of items)i.at=i.quote?text.indexOf(i.quote):-1;
  return {items,status,coverage:true,done,total:r.kind==='巡检'?1:5};
}
function newRun(d,kind='自检'){const v=ver(d);const r={id:id('R'),docId:d.id,v:d.current,text:v.text,preset:v.preset,ctx:ctx(),giftEnded:S.giftEnded,fault:S.fault,kind,at:time(),status:'running',coverage:false,items:[],done:0,total:kind==='巡检'?1:5};S.runs.push(r);return r;}
function syncRun(d,kind='自检'){const r=newRun(d,kind);Object.assign(r,compute(ver(d,r.v),r));return r;}
function check(){const d=doc();if(S.role!=='author')return toast('请切换到内容运营角色执行自检。');if(dirty(d))return toast('正文有未保存修改，请先保存为新版本。');if(S.runs.some(r=>r.docId===d.id&&r.v===d.current&&r.status==='running'))return toast('本版检查正在执行，可稍后查看。');const r=newRun(d);const session=S.session;S.selectedRun=r.id;log('发起自检',`${d.title} V${r.v} · 依据包${S.refsRev}`);update();setTimeout(()=>{if(S.session!==session)return;Object.assign(r,compute(ver(d,r.v),r));if(S.page==='editor'&&S.docId===d.id&&!S.selectedRun)S.selectedRun=r.id;log('检查返回',`${r.id} → V${r.v}，完成${r.done}/${r.total}项${doc(d.id).current!==r.v?'；正文已有新版，保留为历史结果':''}`);update();},S.delay?4300:700);}
function saveVersion(){const d=doc();if(S.role!=='author')return toast('当前角色不能编辑作者稿件。');if(!d.working.trim())return toast('请先输入正文。');if(!dirty(d))return toast('正文没有变化，不新增重复版本。');const v={v:d.current+1,text:d.working,preset:getPreset(d.working),at:time()};d.versions.push(v);d.current=v.v;S.selectedRun=null;S.focusIssue=null;log('保存新版本',`${d.title} V${v.v}；旧正文、结果与审核记录保留`);update();toast(`已保存V${v.v}，请核对本版结果。`);}
function makeTask(d,r){const old=S.tasks.find(t=>t.docId===d.id&&t.v===d.current&&t.ctx===r.ctx&&t.status==='待人工审核');if(old){S.selectedTask=old.id;return old;}for(const t of S.tasks)if(t.docId===d.id&&t.status==='待人工审核')t.status='已被新提交替代';const t={id:id('A'),docId:d.id,v:d.current,runId:r.id,ctx:r.ctx,note:d.note,status:'待人工审核',decisions:{},manual:null,at:time(),history:[]};S.tasks.push(t);return t;}
function submit(){const d=doc();if(S.role!=='author')return toast('正式提交由内容运营发起。');if(dirty(d))return toast('请先保存当前修改。');const r=latestRun(d);if(!r||r.status==='running')return toast('请先完成本版检查，带检查范围及待确认项提交。');const old=currentTask(d);if(old?.v===d.current&&old.status==='退回修改')return toast('请按意见保存修订版本，再重新提交。');const t=makeTask(d,r);log('正式提交',`${t.id} 关联${d.id} V${d.current}，人工待审核`);S.page='review';S.selectedTask=t.id;update();toast('已提交；请切换审核人员继续。');}
function taskReady(t){const d=doc(t.docId),r=runBy(t.runId);if(t.status!=='待人工审核')return {ok:false,why:'该任务当前不在待审状态。'};if(t.v!==d.current)return {ok:false,why:'稿件已有新版，请由作者重新提交当前版本。'};if(t.ctx!==ctx())return {ok:false,why:'当前依据或资料状态已变化，需要重新核对后提交。'};if(!r?.coverage)return {ok:false,why:'自由稿件超出演示覆盖，不能据本原型批准。'};if(r.status!=='done'&&!t.manual)return {ok:false,why:'仍有未完成检查，请重试或留痕人工补核。'};const pending=r.items.filter(i=>!(i.type==='execution'&&t.manual)&&t.decisions[i.code]?.state!=='不成立');if(pending.length)return {ok:false,why:`仍有${pending.length}项问题未解决或未记录复核理由。`};return {ok:true,why:'可由审核人员复核后通过，结论只关联本版。'};}
function approve(){const t=taskBy(S.selectedTask);if(S.role!=='reviewer')return toast('仅审核人员可作正式决定。');const ready=taskReady(t);if(!ready.ok)return toast(ready.why);ask('复核并通过','请记录本次复核结论。此操作仅改变本地模拟状态，不执行真实发布。',note=>{t.status='审核通过';t.history.push({at:time(),action:'通过',by:ROLES[S.role],note});doc(t.docId).approvals.push({v:t.v,ctx:t.ctx,by:ROLES[S.role],at:time(),note});log('人工审核通过',`${t.id} · ${t.docId} V${t.v}；尚不代表已发布`);closeModal();update();toast('已记录本版人工通过结论。');},'已核对当前文案、依据与本次检查范围。');}
function decision(taskId,code,state){if(S.role!=='reviewer')return toast('请切换到审核人员。');const t=taskBy(taskId);if(t.status!=='待人工审核')return toast('该任务已结束，原记录保留。');ask(state==='不成立'?'记录提示不成立的理由':'确认该问题成立','说明原句、依据和判断理由。确认成立后需退回修改，不能直接视为解决。',note=>{t.decisions[code]={state,note,by:ROLES[S.role],at:time()};log('人工确认提示',`${t.id} · ${code} · ${state}`);closeModal();update();});}
function manualCheck(){const t=taskBy(S.selectedTask),r=runBy(t.runId);if(S.role!=='reviewer')return toast('人工补核由审核人员记录。');if(t.status!=='待人工审核')return toast('任务已结束。');if(t.ctx!==ctx()||t.v!==doc(t.docId).current)return toast('上下文已变化，请重新检查当前版本。');if(r.fault==='missing')return toast('请先由活动负责人恢复有效资料，再重新检查提交。');ask('记录人工补核','原失败项保留。请说明人工实际核对了哪些未完成检查、依据是什么。',note=>{t.manual={note,at:time(),by:ROLES[S.role]};log('记录人工补核',`${t.id}；原机器失败记录仍保留`);closeModal();update();});}
function reject(){const t=taskBy(S.selectedTask);if(S.role!=='reviewer')return toast('请切换审核人员。');if(t.status!=='待人工审核')return toast('该任务已结束。');ask('退回作者修改','请把待处理的原句、条件和下一步写清楚。',note=>{t.status='退回修改';t.history.push({at:time(),action:'退回',by:ROLES[S.role],note});doc(t.docId).note='';log('退回修改',`${t.id} · V${t.v}；旧意见与正文保留`);closeModal();update();},'请按已确认的问题补充价格条件，并重新提交修改版本。');}
function contextLabel(r){return `资料包${r.ctx.split('|')[0]} · 审核点R1 · 配置M1`;}
function report(r,t=null){if(!r)return `<div class="empty">${icon('search')}尚未检查当前版本<p class="small">保存正文后执行自检，结果会关联本次正文和依据。</p></div>`;if(r.status==='running')return `<div class="empty"><span class="loading"></span><p>检查处理中 · ${e(r.id)} / V${r.v}</p><p class="small">当前为本地延迟模拟，没有调用模型。</p></div>`;const d=doc(r.docId),stale=r.ctx!==ctx()||r.v!==d.current;let html=`<div class="report-top"><div class="checksummary">${badge(r.status==='done'?'检查完成':'检查部分完成',r.status==='done'?'green':'amber')}${badge(`正文V${r.v}`)}${badge(r.kind,'blue')}</div><div class="reportstat">完成 ${r.done}/${r.total} 项 · ${e(r.id)}<br>${e(contextLabel(r))}</div></div>`;

if(S.focusIssue){const i=r.items.find(x=>x.code===S.focusIssue);if(i?.at>=0){html+=`<div style="margin-top:18px"><h3>原文定位 · V${r.v}</h3><div class="readtext">${e(r.text.slice(0,i.at))}<mark>${e(i.quote)}</mark>${e(r.text.slice(i.at+i.quote.length))}</div></div>`;}}

function nav(){const list=[['overview','grid'],['editor','file'],['review','check'],['inspection','layers'],['sources','database']];return `<aside class="sidebar"><div class="brand"><div class="brandmark">净</div><div><strong>净小伴</strong><small>CONTENT REVIEW</small></div></div><div class="navlabel">内容审核工作空间</div><nav class="sidenav">${list.map(([p,i])=>`<button data-action="nav" data-page="${p}" class="${S.page===p?'current':''}">${icon(i)}${PAGE[p]}${p==='review'&&S.tasks.some(t=>t.status==='待人工审核')?`<span class="navcount">${S.tasks.filter(t=>t.status==='待人工审核').length}</span>`:''}</button>`).join('')}</nav><div class="sidebarfoot">第一次课 · 项目演示<br>自检 / 人工审核 / 历史巡检${btn(icon('setting')+'课堂演示控制','controls','dark')}<p class="desktop-note">离线运行 · 状态保存在当前浏览器</p></div></aside>`;}

function taskTable(tasks){return tasks.length?`<div class="tablewrap"><table><thead><tr><th>稿件与任务</th><th>提交版本</th><th>检查状态</th><th>人工状态</th><th></th></tr></thead><tbody>${tasks.map(t=>{const r=runBy(t.runId);return `<tr><td><div class="rowtitle">${e(doc(t.docId).title)}</div><span class="tiny muted">${e(t.id)} · ${e(t.at)}</span></td><td>V${t.v}</td><td>${badge(r?.status==='done'?'完成':'部分完成',r?.status==='done'?'green':'amber')}</td><td>${badge(t.status,t.status==='审核通过'?'green':t.status==='退回修改'?'amber':'blue')}</td><td>${btn('查看任务','open-task','subtle',`data-task="${t.id}"`)}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">${icon('check')}尚无正式审核任务<p>先完成作者自检，再提交当前版本。</p></div>`;}
function overview(){const pending=S.tasks.filter(t=>t.status==='待人工审核').length,passed=S.tasks.filter(t=>t.status==='审核通过').length,issues=S.batches.flatMap(b=>b.rows).filter(r=>!['本项未发现问题','不适用','已处理'].includes(r.status)).length;return pagehead('WORKSPACE / OVERVIEW','把每次核对，接到下一步处理','净小伴 P1 标准版 · 常规营销文案审核')+`<div class="stats">${[['file','正文版本',S.docs.reduce((n,d)=>n+d.versions.length,0),'修改稿与历史记录分别保留'],['check','待人工审核',pending,'检查完成与人工通过分开'],['layers','巡检待处理',issues,'含范围待确认与实际更新'],['clock','人工通过',passed,'只代表已批准的明确版本']].map(([i,t,n,d])=>`<div class="card stat"><div class="stat-top">${t}${icon(i)}</div><div class="stat-value">${n.toString().padStart(2,'0')}</div><p>${d}</p></div>`).join('')}</div><div class="hero"><div class="eyebrow">FIRST RELEASE · 审核提效</div><h2>从作者先查先改，到审核确认与历史复查</h2><p>围绕一篇P1推广文案，观察依据、问题、修改和使用记录怎样连接。正式决定由人作出。</p><div class="actions">${btn('开始作者自检 '+icon('arrow'),'start-author','primary')}${btn('选择课堂预设场景','controls')}</div></div><div class="flowsteps">${[['01','事前自检','保存明确版本，查看问题与依据，带着待确认项进入审核。','去编辑文案','editor'],['02','事中审核','人工确认、退回与复核，结论对应实际提交的版本。','查看审核任务','review'],['03','事后巡检','权益变化后选范围，跟踪到使用内容的实际更新。','进入巡检中心','inspection']].map(([n,t,d,b,p])=>`<div class="card flowcard"><div class="stepnum"><span>${n}</span>共享审核能力 · 不同责任</div><h2>${t}</h2><p>${d}</p>${btn(b+' '+icon('arrow'),'nav','subtle',`data-page="${p}"`)}</div>`).join('')}</div><div class="grid2"><div class="card table-card"><div class="cardhead"><h2>最近审核任务</h2><span class="muted tiny">当前浏览器的演示记录</span></div>${taskTable([...S.tasks].reverse().slice(0,4))}</div><div class="card"><div class="cardhead"><h2>操作与留痕</h2>${badge('本地模拟')}</div>${recentLogs()}</div></div>`;}
function editor(){const d=doc(),v=ver(d),r=S.selectedRun?runBy(S.selectedRun):latestRun(d),t=currentTask(d),a=approved(d);const validReport=r?.docId===d.id?r:latestRun(d);return pagehead('AUTHOR / SELF-CHECK','内容编辑与自检','先保存版本，再核对原句与依据；可以带待确认项正式提交。',btn('保存为新版本','save-version','',S.role!=='author'?'disabled':'')+btn('运行自检','run-check','primary',S.role!=='author'?'disabled':''))+`<div class="editorgrid"><div class="stack"><div class="card"><div class="cardhead"><div><h2>${e(d.title)}</h2><span class="tiny muted">${e(d.id)} · 单SKU营销文案</span></div>${badge(`当前 V${d.current}`,'blue')}</div><div class="formgrid"><label class="field wide">选择稿件<select id="doc-select">${S.docs.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${e(x.id+' · '+x.title)}</option>`).join('')}</select></label><label class="field">关联商品<input value="P1 标准版" readonly></label><label class="field">关联活动<input value="${e(d.activity)}" readonly></label></div><div class="editor-label"><span>正文 · ${e(v.at)}</span><span id="dirty-label" class="${dirty(d)?'muted':'muted'}">${dirty(d)?'有未保存修改':'已保存'}</span></div><textarea id="draft-text" class="editor" aria-label="营销文案正文" ${S.role!=='author'?'readonly':''}>${e(d.working)}</textarea><div class="toolbar"><span class="tiny muted" style="padding-top:6px">课堂稿件：</span>${btn('初稿 V1','load-copy','',`data-copy="initial" ${S.role!=='author'?'disabled':''}`)}${btn('只改一部分','load-copy','',`data-copy="partial" ${S.role!=='author'?'disabled':''}`)}${btn('条件完整稿','load-copy','',`data-copy="correct" ${S.role!=='author'?'disabled':''}`)}${S.giftEnded?btn('权益更新稿','load-copy','',`data-copy="updated" ${S.role!=='author'?'disabled':''}`):''}</div><label class="field">提交说明 / 待确认事项<textarea id="author-note" class="reviewcomment" style="margin-top:7px" placeholder="例如：价格仍需确认如何表达两类券条件" ${S.role!=='author'?'readonly':''}>${e(d.note)}</textarea></label><div class="divider"></div><div class="actions">${btn('正式提交本版','submit','primary',S.role!=='author'?'disabled':'')}${t?btn('查看最近审核','open-task','',`data-task="${t.id}"`):''}${a?`<span class="approved-stamp">V${a.v} 已有人工作出通过记录</span>`:''}</div><div class="versions">${d.versions.map(x=>`<span class="versionpill ${x.v===d.current?'current':''}">V${x.v} · ${e(x.at)}</span>`).join('')}</div><div class="tiny muted">课堂模板载入后需保存。自由改写超出预设覆盖时会提示范围不足，不会宣称完整审核通过。</div></div><div class="card"><h3>稿件与任务记录</h3>${S.logs.filter(l=>l.detail.includes(d.id)||l.detail.includes(d.title)).slice(0,5).map(l=>`<div class="log"><strong>${e(l.title)}</strong>${e(l.detail)}<br><small>${e(l.at)}</small></div>`).join('')||'<p class="muted small">保存、检查和正式处理后保留记录。</p>'}</div></div><div class="card"><div class="cardhead"><div><h2>检查结果与依据</h2><span class="tiny muted">每次检查绑定正文和资料版本</span></div>${validReport?badge(validReport.id):''}</div>${S.runs.filter(x=>x.docId===d.id).length?`<label class="field">查看检查记录<select id="run-select" style="width:100%;margin:6px 0 15px">${!validReport?'<option value="" selected disabled>本版暂无结果，可选择历史记录</option>':''}${[...S.runs].reverse().filter(x=>x.docId===d.id&&x.kind!=='巡检').map(x=>`<option value="${x.id}" ${x.id===validReport?.id?'selected':''}>${x.id} · V${x.v} · ${x.status==='running'?'运行中':x.status==='done'?'已完成':'部分完成'} · 资料包${x.ctx.split('|')[0]}</option>`).join('')}</select></label>`:''}${report(validReport)}</div></div>`;}
function review(){const t=taskBy(S.selectedTask);if(!t)return pagehead('REVIEW / QUEUE','正式审核任务','系统检查与人工决定分开；任务绑定明确的提交版本。')+`<div class="card table-card">${taskTable([...S.tasks].reverse())}</div>`;const d=doc(t.docId),v=ver(d,t.v),r=runBy(t.runId),ready=taskReady(t);return pagehead('REVIEW / DETAIL',d.title,`${t.id} · 提交V${t.v} · 当前稿件V${d.current}`,btn('返回任务列表','task-list')+btn('转到作者稿件','edit-task','',`data-doc="${d.id}"`))+`<div class="editorgrid"><div class="stack"><div class="card"><div class="cardhead"><h2>提交正文 · V${t.v}</h2>${badge(t.status,t.status==='审核通过'?'green':'blue')}</div><div class="readtext">${renderMarked(v.text,r)}</div><div class="inline-dl"><dt>关联商品</dt><dd>${e(d.sku)}</dd><dt>关联活动</dt><dd>${e(d.activity)}</dd><dt>检查依据</dt><dd>${e(contextLabel(r))}</dd><dt>作者说明</dt><dd>${e(t.note||'未填写')}</dd></div>${d.current!==t.v?'<div class="hint warn">稿件已有新版。本任务保留原提交记录，不能直接作为新版的通过结论。</div>':''}${t.ctx!==ctx()?'<div class="hint warn">资料或适用条件已变化，需重新核对并提交。</div>':''}</div><div class="card"><h2>版本与人工处理</h2><div class="versions">${d.versions.map(x=>`<span class="versionpill ${x.v===t.v?'current':''}">V${x.v}${x.v===t.v?' · 本次提交':''}</span>`).join('')}</div>${comparison(d,t.v)}${t.history.map(h=>`<div class="log"><strong>${e(h.action)} · ${e(h.by)}</strong>${e(h.note)}<br><small>${e(h.at)}</small></div>`).join('')||'<p class="muted small">等待审核人员核对原句、依据和待处理事项。</p>'}${t.manual?`<div class="hint">人工补核：${e(t.manual.note)}<br><span class="tiny">${e(t.manual.by)} · ${e(t.manual.at)}；原失败记录保留</span></div>`:''}</div></div><div class="card"><div class="cardhead"><h2>问题与复核</h2>${badge(`V${r.v}`)}</div>${report(r,t)}${t.status==='待人工审核'?`<div class="reviewactions"><div class="hint ${ready.ok?'':'warn'}">${e(ready.why)}</div><div class="actions">${btn('退回作者修改','reject','danger',S.role!=='reviewer'?'disabled':'')}${r.status!=='done'?btn('记录人工补核','manual-check','',S.role!=='reviewer'?'disabled':''):''}${btn('复核并通过','approve','primary',S.role!=='reviewer'||!ready.ok?'disabled':'')}</div><p class="tiny muted">当前角色：${e(ROLES[S.role])}。角色切换仅供课堂扮演，不构成真实认证。</p></div>`:''}</div></div>`;}
function comparison(d,n){const prev=d.versions.filter(x=>x.v<n).at(-1);return prev?`<details class="evidence"><summary>对照上一版 V${prev.v} 正文</summary><div class="readtext">${e(prev.text)}</div><p class="tiny muted">本次复核仍以V${n}与当前适用依据为准；历史正文保留。</p></details>`:'';}
function renderMarked(text,r){const i=r?.items.find(x=>x.code===S.focusIssue);return i?.at>=0?e(text.slice(0,i.at))+'<mark>'+e(i.quote)+'</mark>'+e(text.slice(i.at+i.quote.length)):e(text);}
function addFixtures(){if(S.assets.length)return;const defs=[['C01','D11','P1赠品推广文案','使用中','correct'],['C02','D12','P1历史赠品文案','已停用','correct'],['C03','D13','已说明名额用完的推广','使用中','updated'],['C04','D14','其他活动清洁包介绍','使用中','correct'],['C05','D15','P1清洁功能介绍','使用中','function'],['C06','D16','使用状态待核的旧稿','待确认','correct']];for(const [aid,did,title,status,preset]of defs){const d=makeDoc(did,title,TEXT[preset],preset,true);if(aid==='C04')d.activity='另一项独立活动';if(aid==='C03')d.approvals[0].ctx=ctx();S.docs.push(d);S.assets.push({id:aid,docId:did,title,status,usedV:1,activity:d.activity,owner:'小陈',usage:aid==='C01'?'官方账号 · 商品推广':aid==='C06'?'待核实使用位置':'教学内容登记',updated:false});}S.scope=['C01','C03','C05'];}
function endGift(){if(S.giftEnded)return toast('本次权益变化已经登记，原事件保留。');if(S.role!=='curator')return toast('请切换活动负责人登记，或通过演示控制加载巡检场景。');activateGift();update();toast('已登记名额用完；历史原审核保留，需复查当前使用内容。');}
function activateGift(){S.giftEnded=true;S.refsRev=2;S.event={id:'E-GIFT-01',by:'活动负责人 · 小许',at:time(),detail:evidence.event};addFixtures();log('登记权益变化','E-GIFT-01 · 资料包2；载入教学历史内容及一篇已先行更新的示例');}
function startBatch(){if(!['owner','curator'].includes(S.role))return toast('请切换内容或活动负责人发起巡检。');if(!S.giftEnded)return toast('请先由负责人确认并登记权益变化。');const selected=S.assets.filter(a=>S.scope.includes(a.id)&&a.status==='使用中'&&a.activity==='养宠家庭推广活动');if(!selected.length)return toast('至少选择一篇本次活动的在用内容。');const rows=[];for(const a of selected){const d=doc(a.docId),r=syncRunAtUsage(d,a);rows.push(makeBatchRow(a,r));}for(const a of S.assets.filter(a=>a.status==='待确认'&&a.activity==='养宠家庭推广活动'))if(!rows.some(x=>x.assetId===a.id))rows.push({assetId:a.id,runId:null,status:'范围待核',assignee:'',note:''});const b={id:id('P'),at:time(),event:S.event.id,ctx:ctx(),rows,selected:selected.map(x=>x.id)};S.batches.push(b);S.selectedBatch=b.id;log('发起巡检',`${b.id} · ${selected.length}篇确认在用，${rows.filter(x=>x.status==='范围待核').length}篇范围待核`);update();}
function syncRunAtUsage(d,a){const old=d.current;d.current=a.usedV;const r=syncRun(d,'巡检');d.current=old;return r;}
function makeBatchRow(a,r){const gift=r.items.some(x=>x.code==='gift'),failed=r.status!=='done';return {assetId:a.id,runId:r.id,status:failed?'检查待核':gift?'待认领':r.preset==='function'?'不适用':'本项未发现问题',assignee:'',note:''};}
function batchComplete(b){return b.rows.every(x=>['本项未发现问题','不适用','已处理'].includes(x.status));}
function inspection(){const b=batchBy(S.selectedBatch);const scopeCard=`<div class="card table-card"><div class="cardhead"><div><h2>选择本次活动的在用内容</h2><span class="muted tiny">资料包${S.refsRev} · 不把未知范围默认为已覆盖</span></div>${btn('发起批量巡检','start-batch','primary',!S.giftEnded?'disabled':'')}</div>${S.assets.length?`<div class="tablewrap"><table><thead><tr><th>选择</th><th>内容</th><th>活动与使用状态</th><th>当前使用版本</th><th>维护人</th></tr></thead><tbody>${S.assets.map(a=>`<tr><td><input type="checkbox" class="scope-check" aria-label="选择${a.id}" data-scope="${a.id}" ${S.scope.includes(a.id)?'checked':''} ${a.status!=='使用中'||a.activity!=='养宠家庭推广活动'?'disabled':''}></td><td><div class="rowtitle">${e(a.id+' · '+a.title)}</div><span class="muted tiny">${e(a.usage)}</span></td><td>${e(a.activity)}<br>${badge(a.status,a.status==='待确认'?'amber':a.status==='使用中'?'green':'gray')}</td><td>V${a.usedV}${a.updated?' · 已登记更新':''}</td><td>${e(a.owner)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">先登记权益变化，再载入课堂历史内容登记表。</div>'}</div>`;
return pagehead('POST-REVIEW / INSPECTION','历史内容巡检','先确认变化与范围，再把问题跟踪到实际使用内容更新。',btn('登记赠品名额用完','end-gift','',S.giftEnded?'disabled':'')+btn('切换为内容负责人','role-owner'))+`<div class="hint ${S.giftEnded?'':'warn'}">${S.giftEnded?`<strong>E-GIFT-01 已登记：</strong>${e(evidence.event)}<br><span class="tiny">变化为教学模拟；C03代表负责人已先行更新的内容。${S.assets.some(a=>a.status==='待确认')?'仍有使用状态待核，需保留确认事项。':'当前登记中的使用状态已确认。'}</span>`:'尚未登记本次权益变化。可由活动负责人确认，或在课堂控制中加载巡检场景。'}</div>${scopeCard}${S.batches.length?`<div class="sectionline"><h2>巡检批次与处理</h2><select id="batch-select" aria-label="选择巡检批次">${[...S.batches].reverse().map(x=>`<option value="${x.id}" ${b?.id===x.id?'selected':''}>${x.id} · ${x.at} · ${batchComplete(x)?'已闭环':'仍有待处理'}</option>`).join('')}</select></div>`:''}${b?batchReport(b):''}`;}
function batchReport(b){const needs=b.rows.filter(x=>!['本项未发现问题','不适用','已处理'].includes(x.status)).length;return `<div class="card table-card"><div class="cardhead"><div><h2>${b.id} · 权益变化复查</h2><span class="muted tiny">${b.event} · ${e(b.at)} · ${b.selected.length}篇原选定内容</span></div>${badge(batchComplete(b)?'处理完成':'仍有待处理',needs?'amber':'green')}</div><div style="padding:0 22px"><div class="metricsbar"><div><strong>${b.rows.length}</strong><span>记录内容（含待核）</span></div><div><strong>${needs}</strong><span>需继续确认或处理</span></div><div><strong>${b.rows.filter(x=>x.status==='已处理').length}</strong><span>已核验更新</span></div></div></div><div class="tablewrap"><table><thead><tr><th>内容 / 原使用版本</th><th>处理状态</th><th>处理人及记录</th><th>下一步</th></tr></thead><tbody>${b.rows.map(row=>{const a=S.assets.find(x=>x.id===row.assetId),d=doc(a.docId),approval=approved(d),hasNew=approval&&approval.ctx===ctx()&&d.current>a.usedV;let actions='';if(row.status==='范围待核')actions=btn('确认仍在使用并补查','resolve-scope','subtle',`data-batch="${b.id}" data-asset="${a.id}"`);else if(row.status==='待认领'||row.status==='检查待核')actions=btn('认领处理','claim-row','subtle',`data-batch="${b.id}" data-asset="${a.id}"`);else if(row.status==='已认领待修订')actions=btn('创建修订稿（转作者）','revise-asset','subtle',`data-batch="${b.id}" data-asset="${a.id}"`);else if(row.status==='修订待审核')actions=hasNew?btn('确认实际更新','finalize-asset','primary',`data-batch="${b.id}" data-asset="${a.id}"`):btn('进入修订稿','edit-asset','subtle',`data-asset="${a.id}"`);if(row.runId)actions+=btn('检查记录','show-run','subtle',`data-run="${row.runId}"`);return `<tr><td><div class="rowtitle">${e(a.id+' · '+a.title)}</div><span class="tiny muted">${row.runId?e(row.runId)+' · V'+runBy(row.runId).v:'范围确认后再检查'}</span></td><td>${badge(row.status,['已处理','本项未发现问题','不适用'].includes(row.status)?'green':'amber')}${hasNew&&row.status==='修订待审核'?'<p class="tiny">新稿已通过，尚未登记实际更新</p>':''}</td><td>${e(row.assignee||'尚未分配')}${row.note?`<p class="tiny muted">${e(row.note)}</p>`:''}</td><td><div class="actions">${actions}</div></td></tr>`;}).join('')}</tbody></table></div><div style="padding:5px 22px 18px"><p class="tiny muted">运行完成与问题处理完成分开。原审核通过记录保留，当前巡检关联新的业务条件。</p></div></div>`;}
function getRow(bid,aid){const b=batchBy(bid);return {b,row:b.rows.find(x=>x.assetId===aid),a:S.assets.find(x=>x.id===aid)};}
function needOwner(){if(S.role!=='owner'){toast('请切换到内容负责人处理使用状态与巡检事项。');return false;}return true;}
function claimRow(bid,aid){if(!needOwner())return;const {row}=getRow(bid,aid);row.assignee='小陈';row.status='已认领待修订';log('认领巡检问题',`${bid} · ${aid} → 小陈`);update();}
function resolveScope(bid,aid){if(!needOwner())return;const {row,a}=getRow(bid,aid);ask('确认使用状态并补查','本示例确认仍在使用，并在本批次追加核对记录；原待核记录留痕。',note=>{a.status='使用中';a.usage='负责人已确认的在用位置（模拟）';const r=syncRunAtUsage(doc(a.docId),a);Object.assign(row,makeBatchRow(a,r));row.note=note;log('确认范围并补查',`${bid} · ${aid} · ${note}`);closeModal();update();});}
function reviseAsset(bid,aid){if(!needOwner())return;const {row,a}=getRow(bid,aid),d=doc(a.docId);d.working=TEXT.updated;d.current+=1;d.versions.push({v:d.current,text:TEXT.updated,preset:'updated',at:time()});d.note=`巡检${bid}关联${aid}，请复核权益更新稿；实际使用内容尚未更新。`;row.status='修订待审核';row.note='修订稿已创建，需作者检查与提交、人工审核，再确认实际更新。';S.docId=d.id;S.role='author';S.page='editor';S.selectedRun=null;log('创建巡检修订稿',`${aid} → ${d.id} V${d.current}；进入作者流程`);update();}
function finalizeAsset(bid,aid){if(!needOwner())return;const {row,a}=getRow(bid,aid),d=doc(a.docId),approval=approved(d);if(!approval||approval.ctx!==ctx()||d.current<=a.usedV)return toast('修订稿需要先完成当前依据下的人工审核。');ask('确认实际使用内容已更新','请记录已核实的使用位置与新版本。只改内部文档不能关闭本项；此处为课堂模拟确认。',note=>{a.usedV=d.current;a.updated=true;row.status='已处理';row.assignee='小陈';row.note=note;log('登记实际更新',`${aid} 使用V${d.current} · ${note}`);closeModal();update();});}
function sources(){return pagehead('REFERENCES / RULES','资料与审核点','每次检查使用已确认的适用依据；资料版本与正文版本分别保留。',btn('登记赠品名额用完','end-gift','primary',S.giftEnded?'disabled':''))+`<div class="grid2"><div class="card"><div class="cardhead"><h2>本次有效资料</h2>${badge(`资料包 ${S.refsRev}`,'green')}</div>${[['商品资料','F-PROD-01 v1','product','产品负责人'],['活动价格','F-PROMO-01 v1','price','活动负责人'],['赠品方案','F-GIFT-01 v1','gift','活动负责人'],['配送说明','F-SHIP-01 v1','ship','履约负责人'],...(S.giftEnded?[['权益变化','E-GIFT-01','event','活动负责人']]:[])].map(([title,key,ref,owner])=>`<div class="ref-block"><div class="ref-header"><h3>${title}</h3>${badge(key)}</div><p>${e(evidence[ref])}</p><span class="tiny muted">${owner}确认 · 本课教学资料</span></div>`).join('')}<div class="hint">初始方案与后续权益变化分别保留。名额事实由负责人确认，原型没有查询订单、库存或广告平台。</div></div><div class="stack"><div class="card"><h2>首版检查点 · R1</h2>${[['R01','温度与功能对象','出现温度数值时，比较主张对象；未提温度不强制补写。'],['R02','价格与资格条件','核对1799元路径、会员和两类券；条件可结合全文。'],['R03','赠品条件及当前权益','核对限定条件与生效变化；范围不明先确认。'],['R04','承诺是否有依据','避障、到达时间等承诺不以常识补齐。'],['R05','上下文与执行完整性','缺资料、执行失败、不适用分别显示。']].map(([id,t,d])=>`<div class="ref-block"><span class="eyebrow">${id}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}</div><div class="card"><h2>课堂范围</h2><p class="small muted">预设脚本支持初稿、中间稿、条件完整稿、权益更新稿与功能稿。自由文本只提示演示覆盖限制。本页面无真实模型、审批服务、身份认证与发布执行。</p><p><a href="../01_讲义与材料/第一次课_完整老师讲义_常规审核版_v1.0.html" target="_blank">查看第一次课完整讲义 ↗</a></p></div></div></div>`;}
function controls(){modalHandler=null;openModal(`<div class="modal-head"><div><div class="eyebrow">CLASSROOM CONTROLS</div><h2>课堂演示控制</h2></div>${btn('关闭','close-modal','subtle')}</div><div class="hint warn">加载下列场景会清空当前浏览器中的演示进度，创建明确标注的教学预设；不会产生真实审核或发布。</div><div class="scenariogrid">${[['author','01 · 作者自检','从初稿开始，观察问题、依据和修改。'],['review','02 · 正式复核','载入带价格问题的V2待审任务。'],['inspection','03 · 权益变化巡检','载入赠品用完事件和六篇内容登记。'],['race','04 · 版本变化','开启延迟，运行后保存新版，观察旧结果返回。']].map(([k,t,d])=>`<button class="scenario" data-action="scenario" data-scenario="${k}"><strong>${t}</strong><span>${d}</span></button>`).join('')}</div><div class="formgrid"><label class="field">异常开关<select id="fault-select"><option value="none" ${S.fault==='none'?'selected':''}>正常预设检查</option><option value="missing" ${S.fault==='missing'?'selected':''}>活动资料不可用</option><option value="timeout" ${S.fault==='timeout'?'selected':''}>功能检查超时</option><option value="quote" ${S.fault==='quote'?'selected':''}>原文引用校验失败</option></select></label><label class="field">返回速度<select id="delay-select"><option value="fast" ${!S.delay?'selected':''}>快速演示（约0.7秒）</option><option value="slow" ${S.delay?'selected':''}>延迟演示（约4.3秒）</option></select></label></div><p class="tiny muted">异常开关影响下一次运行。历史记录不被覆盖。活动资料不可用时需恢复资料并重新检查；其他未完成项可演示人工补核。</p><div class="actions">${btn('导出演示记录','export')}${btn('重置全部演示','reset','danger')}${btn('返回课堂页面','close-modal','primary')}</div><div class="divider"></div><a class="small" href="第一次课_演示操作说明.html" target="_blank">打开第一次课演示操作说明 ↗</a>`);}
function scenario(k){S=seed();if(k==='review'){const d=doc();d.versions.push({v:2,text:TEXT.partial,preset:'partial',at:time()});d.current=2;d.working=TEXT.partial;d.note='价格仍需确认资格与两类券表达。';const r=syncRun(d);const t=makeTask(d,r);S.selectedTask=t.id;S.page='review';S.role='reviewer';log('载入教学预设','V2待人工审核，结果由本地脚本生成');}else if(k==='inspection'){S.role='owner';activateGift();S.page='inspection';}else{S.page='editor';S.role='author';S.delay=k==='race';log('载入教学预设',k==='race'?'延迟返回场景，请运行后载入并保存新稿':'作者初稿自检');}closeModal();update();toast('预设场景已载入，原演示进度已重置。');}
function render(){if(!doc())S.docId='D01';document.getElementById('app').innerHTML=`<div class="shell">${nav()}<main class="main"><header class="topbar"><div class="breadcrumb">内容工作空间 <span style="padding:0 10px">/</span> <strong>${PAGE[S.page]}</strong></div><div class="topright"><span class="rolelabel">课堂扮演角色</span><div class="avatar">${ROLES[S.role].slice(-1)}</div><select id="role-select" class="role-select" aria-label="切换课堂角色">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${S.role===k?'selected':''}>${v}</option>`).join('')}</select></div></header><div class="sim-banner"><span><span class="dot"></span>课堂演示 · 本地模拟 · 只使用预设检查</span><span>不调用真实模型 / 不执行真实发布</span></div><div class="content">${({overview,editor,review,inspection,sources}[S.page]||overview)()}<div class="footnote">净小伴 P1 · 第一次课课堂原型 / 品牌、数据与流程均为教学模拟 / 浏览器本地保存</div></div></main></div>`;}
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='draft-text'){doc().working=el.value;const lab=document.getElementById('dirty-label');if(lab)lab.textContent=dirty(doc())?'有未保存修改':'已保存';save();}if(el.id==='author-note'){doc().note=el.value;save();}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='role-select'){S.role=el.value;log('切换课堂角色',ROLES[S.role]);update();}else if(el.id==='doc-select'){S.docId=el.value;S.selectedRun=null;S.focusIssue=null;update();}else if(el.id==='run-select'){S.selectedRun=el.value;S.focusIssue=null;update();}else if(el.id==='batch-select'){S.selectedBatch=el.value;update();}else if(el.id==='fault-select'){S.fault=el.value;log('设置教学异常',el.options[el.selectedIndex].text);save();render();}else if(el.id==='delay-select'){S.delay=el.value==='slow';save();}else if(el.dataset.scope){const v=el.dataset.scope;S.scope=el.checked?[...new Set([...S.scope,v])]:S.scope.filter(x=>x!==v);save();}});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;try{
if(a==='nav'){S.page=el.dataset.page;if(S.page==='review')S.selectedTask=null;S.focusIssue=null;update();}
else if(a==='start-author'){S.page='editor';S.role='author';update();}
else if(a==='controls')controls();else if(a==='close-modal')closeModal();else if(a==='modal-save'){const note=document.getElementById('modal-note')?.value.trim();if(!note||note.length<4)return toast('请填写至少4个字的处理说明。');const handler=modalHandler;if(handler)handler(note);}
else if(a==='save-version')saveVersion();else if(a==='run-check')check();else if(a==='submit')submit();
else if(a==='load-copy'){if(S.role!=='author')return toast('请切换内容运营。');doc().working=TEXT[el.dataset.copy];S.focusIssue=null;update();toast('教学稿已载入，请保存为新版本。');}
else if(a==='open-task'){S.selectedTask=el.dataset.task;S.page='review';S.focusIssue=null;update();}
else if(a==='task-list'){S.selectedTask=null;update();}
else if(a==='edit-task'){S.docId=el.dataset.doc;S.page='editor';S.selectedRun=null;update();}
else if(a==='locate'){const r=runBy(el.dataset.run),i=r.items.find(x=>x.code===el.dataset.code);S.focusIssue=i.code;update();if(document.getElementById('modal').open&&r.kind==='巡检'){openModal(`<div class="modal-head"><h2>${e(r.id)} · 巡检记录</h2>${btn('关闭','close-modal','subtle')}</div>${report(r)}`);}const ta=document.getElementById('draft-text');if(ta&&doc(r.docId).current===r.v&&!dirty(doc(r.docId))){ta.focus();ta.setSelectionRange(i.at,i.at+i.quote.length);}}
else if(a==='confirm-issue')decision(el.dataset.task,el.dataset.code,'成立');else if(a==='dismiss-issue')decision(el.dataset.task,el.dataset.code,'不成立');
else if(a==='approve')approve();else if(a==='reject')reject();else if(a==='manual-check')manualCheck();
else if(a==='role-owner'){S.role='owner';update();}else if(a==='end-gift')endGift();else if(a==='start-batch')startBatch();
else if(a==='claim-row')claimRow(el.dataset.batch,el.dataset.asset);else if(a==='resolve-scope')resolveScope(el.dataset.batch,el.dataset.asset);else if(a==='revise-asset')reviseAsset(el.dataset.batch,el.dataset.asset);
else if(a==='edit-asset'){S.docId=S.assets.find(x=>x.id===el.dataset.asset).docId;S.page='editor';S.selectedRun=null;update();}
else if(a==='finalize-asset')finalizeAsset(el.dataset.batch,el.dataset.asset);
else if(a==='show-run'){const r=runBy(el.dataset.run);modalHandler=null;openModal(`<div class="modal-head"><h2>${e(r.id)} · 巡检记录</h2>${btn('关闭','close-modal','subtle')}</div>${report(r)}`);}
else if(a==='scenario')scenario(el.dataset.scenario);
else if(a==='reset'){modalHandler=()=>{S=seed();closeModal();update();toast('演示已重置。');};openModal(`<h2>重置本地演示？</h2><p class="muted small">清空当前浏览器的稿件修改、任务、巡检与记录，恢复初始教学案例。不会操作外部系统。</p><textarea id="modal-note" hidden>确认重置本地演示</textarea><div class="actions">${btn('取消','close-modal')}${btn('确认重置','modal-save','danger')}</div>`);}
else if(a==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='第一次课_本地演示记录.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前浏览器中的模拟记录。');}
}catch(error){toast('操作未完成：'+error.message);console.error(error);}});
render();
})();
</script></body></html>
