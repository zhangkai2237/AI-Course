<g id="heading" data-pptx-bounds="56 40 1176 148"><text x="56" y="65" font-size="20" font-weight="bold" fill="#2457D6">第二节 · 项目目标 / 本节产物</text><text x="56" y="126" font-size="48" font-weight="bold" fill="#172C4D">把目标收成一份首版项目定义</text><text x="56" y="175" font-size="28" font-weight="bold" fill="#2457D6">在资料齐全的小范围中辅助审核，用实际工作效果验证价值。</text></g>
<g id="project-definition" data-pptx-bounds="56 212 1176 288"><rect x="56" y="212" width="1176" height="288" rx="8" fill="#EAF0FB"/><rect x="56" y="212" width="6" height="288" fill="#2457D6"/><text x="80" y="257" font-size="28" fill="#172C4D">面向内容作者、审核员及相关业务负责人，<tspan x="80" dy="42">在单SKU文案的自检、正式审核与历史内容巡检中，</tspan><tspan x="80" dy="42">依据已确认且适用的商品、活动和配送资料，辅助定位问题、展示依据，</tspan><tspan x="80" dy="42">衔接修改复核及后续处理，减少重复查找、沟通和复核。</tspan><tspan x="80" dy="42">由人作正式审核与内容处置决定；先在资料齐全的少量商品中试用，</tspan><tspan x="80" dy="42">用问题质量、总人工投入和处理效果验证价值。</tspan></text></g>
<g id="future-conditions" data-pptx-bounds="56 521 1176 56"><text x="56" y="543" font-size="20" fill="#61718A">后续另设检查覆盖、资料有效性、质量证据、处置权限与人工兜底条件，<tspan x="56" dy="30">再评估限定场景自动审核。</tspan></text></g>
<g id="next-section" data-pptx-bounds="56 595 1176 68"><text x="56" y="616" font-size="20" fill="#2457D6">下一节 · 业务方案 / 按这份定义，把三个环节分别走通</text><text x="56" y="652" font-size="28" font-weight="bold" fill="#172C4D">谁发起 → 带什么材料 → 看到什么结果 → 下一步由谁接手</text></g>
