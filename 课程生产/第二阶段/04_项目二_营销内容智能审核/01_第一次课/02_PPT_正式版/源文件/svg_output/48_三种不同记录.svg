<g id="header" data-pptx-bounds="48 32 1184 125"><text x="48" y="62" font-size="20" fill="#126B63">第二篇·做方案 / 6.1 架构、数据流与记录</text><text x="48" y="125" font-size="42" font-weight="bold" fill="#17302F">检查完成、问题解决、审核通过，是三件事</text></g>
<g id="check" data-pptx-bounds="48 198 368 268"><rect x="48" y="198" width="368" height="268" rx="12" fill="#E8F2EF"/><text x="76" y="250" font-size="32" font-weight="bold" fill="#126B63">检查记录</text><text x="76" y="318" font-size="28" fill="#17302F">对哪个版本查了什么<tspan x="76" dy="48">使用哪份依据</tspan><tspan x="76" dy="48">哪些完成、哪些失败</tspan></text></g>
