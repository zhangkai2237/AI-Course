<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, PingFang SC, sans-serif" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="heading" data-pptx-bounds="56 40 1176 105"><text x="56" y="65" font-size="20" font-weight="bold" fill="#2457D6">第一节 · 业务背景 / 1.4 痛点归纳</text><text x="56" y="126" font-size="48" font-weight="bold" fill="#172C4D">审核提效需求，来自哪些具体痛点？</text></g>
<g id="pain-finding" data-pptx-bounds="56 180 1176 85"><text x="56" y="210" font-size="24" fill="#2457D6">01</text><text x="112" y="211" font-size="28" font-weight="bold" fill="#172C4D">查找资料</text><text x="350" y="211" font-size="24" fill="#172C4D">一会儿看正文，一会儿翻商品、活动和配送资料。</text><text x="350" y="250" font-size="24" fill="#61718A">没有明显错误的句子，也需要找到依据后才能确认。</text><line x1="56" y1="264" x2="1232" y2="264" stroke="#D8E0EC"/></g>
<g id="pain-explaining" data-pptx-bounds="56 286 1176 85"><text x="56" y="316" font-size="24" fill="#2457D6">02</text><text x="112" y="317" font-size="28" font-weight="bold" fill="#172C4D">解释往返</text><text x="350" y="317" font-size="24" fill="#172C4D">“价格补条件” → 作者改成“领券1799” → 还要再改。</text><text x="350" y="356" font-size="24" fill="#61718A">作者没收到完整条件，仍漏了新会员资格与两类券。</text><line x1="56" y1="370" x2="1232" y2="370" stroke="#D8E0EC"/></g>
<g id="pain-rechecking" data-pptx-bounds="56 392 1176 85"><text x="56" y="422" font-size="24" fill="#2457D6">03</text><text x="112" y="423" font-size="28" font-weight="bold" fill="#172C4D">版本复核</text><text x="350" y="423" font-size="24" fill="#172C4D">作者说“已修改”，小林还要重新找旧意见、新原句和依据。</text><text x="350" y="462" font-size="24" fill="#61718A">确认原问题已解决，还要核对这一版的其他改动。</text><line x1="56" y1="476" x2="1232" y2="476" stroke="#D8E0EC"/></g>
<g id="pain-maintaining" data-pptx-bounds="56 498 1176 85"><text x="56" y="528" font-size="24" fill="#2457D6">04</text><text x="112" y="529" font-size="28" font-weight="bold" fill="#172C4D">后续维护</text><text x="350" y="529" font-size="24" fill="#172C4D">活动负责人确认赠品名额用完，还得找到相关在用内容和维护人。</text><text x="350" y="568" font-size="24" fill="#61718A">停用内容、其他活动、只讲功能的内容，不能一律修改。</text><line x1="56" y1="582" x2="1232" y2="582" stroke="#D8E0EC"/></g>
<g id="transition" data-pptx-bounds="56 608 1176 64"><text x="56" y="637" font-size="28" font-weight="bold" fill="#2457D6">下一节：明确希望减少哪些劳动，以及第一版做到哪里。</text><text x="56" y="663" font-size="20" fill="#61718A">记录作者与审核员双方的总投入，再判断是否提效。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="56 676 1176 24"><text x="56" y="694" font-size="14" fill="#61718A">教学模拟 / 痛点来自具体工作片段</text><text x="1232" y="694" font-size="14" text-anchor="end" fill="#61718A">06</text></g></svg>
