<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F7F8F4"/>
<g id="header" data-pptx-bounds="48 32 1184 125"><text x="48" y="62" font-size="20" fill="#126B63">第二篇·做方案 / 5.1 混合审核与方案选择</text><text x="48" y="125" font-size="42" font-weight="bold" fill="#17302F">先比较四种办法，再决定组合到什么程度</text></g>
<g id="manual" data-pptx-bounds="48 193 560 171"><text x="48" y="235" font-size="32" font-weight="bold" fill="#17302F">清单＋人工</text><text x="48" y="292" font-size="28" fill="#17302F">先解决资料找不到、提交不齐<tspan x="48" dy="45">自由表达仍要逐句人工核对</tspan></text></g>
<g id="rules" data-pptx-bounds="686 193 546 171"><text x="686" y="235" font-size="32" font-weight="bold" fill="#17302F">规则为主</text><text x="686" y="292" font-size="28" fill="#17302F">明确条件与计算，便于核对<tspan x="686" dy="45">多种自然表达的维护成本要测</tspan></text></g>
<g id="llm" data-pptx-bounds="48 411 560 171"><text x="48" y="453" font-size="32" font-weight="bold" fill="#17302F">模型为主</text><text x="48" y="510" font-size="28" fill="#17302F">理解对象、条件和多种说法<tspan x="48" dy="45">可能误读、漏条件、错误引用</tspan></text></g>
<g id="hybrid" data-pptx-bounds="656 393 576 201"><rect x="656" y="393" width="576" height="201" rx="12" fill="#E8F2EF"/><text x="686" y="453" font-size="32" font-weight="bold" fill="#126B63">组合方案</text><text x="686" y="510" font-size="28" fill="#17302F">按任务分工，保留责任确认<tspan x="686" dy="45">也增加交接、维护与纠错成本</tspan></text></g>
<g id="principle" data-pptx-bounds="48 612 1184 42"><text x="48" y="641" font-size="24" fill="#617673">不是绝对能力边界：比较质量、维护、时延与总人工投入；不默认AI越多越好。</text></g><g id="course-nav" data-pptx-bounds="0 660 1280 60"><rect x="0" y="660" width="1280" height="60" fill="#FFFFFF"/><line x1="48" y1="660" x2="1232" y2="660" stroke="#D3DFDA"/>
<g font-size="14" fill="#617673"><text id="nav-1" x="48" y="691">1 业务背景</text><text id="nav-2" x="207" y="691">2 目标范围</text><text id="nav-3" x="366" y="691">3 三段流程</text><text id="nav-4" x="525" y="691">4 审核点</text><text id="nav-5" fill="#126B63" font-weight="bold" x="684" y="691">5 能力分工</text><text id="nav-6" x="843" y="691">6 产品方案</text><text id="nav-7" x="1002" y="691">7 实施验证</text></g>
<text x="1232" y="691" text-anchor="end" font-size="14" fill="#617673">37 / 70</text></g></svg>
