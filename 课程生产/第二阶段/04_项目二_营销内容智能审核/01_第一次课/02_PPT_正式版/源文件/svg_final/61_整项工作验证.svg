<g id="header" data-pptx-bounds="48 32 1184 125"><text x="48" y="62" font-size="20" fill="#126B63">第三篇·验落地 / 7.2 质量与总投入验证</text><text x="48" y="125" font-size="42" font-weight="bold" fill="#17302F">验证的对象，是整项审核工作</text></g>
<g id="evidence-tracks" data-pptx-bounds="48 198 1184 380"><g font-size="28" fill="#17302F"><text x="48" y="240"><tspan font-weight="bold" fill="#126B63">质量</tspan>　漏报、误报、引用是否适用，信息不足是否被混成无问题</text><text x="48" y="319"><tspan font-weight="bold" fill="#126B63">人工</tspan>　作者＋审核人员总投入；等待业务回复的时间另行记录</text><text x="48" y="398"><tspan font-weight="bold" fill="#126B63">版本</tspan>　V2结果是否误用到V3，结论能否对应实际使用版本</text><text x="48" y="477"><tspan font-weight="bold" fill="#126B63">巡检</tspan>　未知范围有没有跟进，问题有没有人接收并完成实际更新</text><text x="48" y="556"><tspan font-weight="bold" fill="#126B63">运行</tspan>　成本、时延、重试和人工接管，能否满足试用安排</text></g></g>
<g id="threshold" data-pptx-bounds="48 605 1184 46"><text x="48" y="637" font-size="24" fill="#617673">阶段门槛由业务基线、可接受风险和资源共同决定，不套用别人的通用准确率。</text></g><g id="course-nav" data-pptx-bounds="0 660 1280 60"><rect x="0" y="660" width="1280" height="60" fill="#FFFFFF"/><line x1="48" y1="660" x2="1232" y2="660" stroke="#D3DFDA"/>
