<g id="compare" data-pptx-bounds="48 190 1184 240"><rect x="48" y="190" width="1184" height="240" rx="12" fill="#FFFFFF"/><text x="78" y="241" font-size="28" fill="#D85C3D">“1799元，人人同价” → 遗漏资格、用券条件，扩大人群</text><text x="78" y="312" font-size="28" fill="#D85C3D">“领券到手1799元” → 新会员与两类券仍未说明</text><text x="78" y="383" font-size="28" fill="#126B63">新会员领用400元活动券及200元专享券后1799 → 核对路径</text></g>
<g id="context" data-pptx-bounds="48 473 1184 170"><text x="48" y="510" font-size="32" fill="#17302F" font-weight="bold">按全文判断语义，保留表达自由。</text><text x="48" y="566" font-size="28" fill="#17302F">条件可以跨句清楚交代；只宣传一种价格，就核对该路径。</text><text x="48" y="618" font-size="24" fill="#617673">没有价格主张不强加价格；不强制唯一句式；缺有效活动资料不能完整判断。</text></g><g id="course-nav" data-pptx-bounds="0 660 1280 60"><rect x="0" y="660" width="1280" height="60" fill="#FFFFFF"/><line x1="48" y1="660" x2="1232" y2="660" stroke="#D3DFDA"/>
