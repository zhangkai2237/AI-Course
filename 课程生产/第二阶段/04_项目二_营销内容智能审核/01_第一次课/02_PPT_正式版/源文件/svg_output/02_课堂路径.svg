<g id="learning-loop" data-pptx-bounds="48 563 1184 82"><text x="48" y="598" font-size="28" fill="#17302F">每章：一个问题 → 分步推导 → 一份产物 → 进入下一步</text><text x="48" y="632" font-size="20" fill="#617673">用同一篇净小伴P1营销文案贯穿；案例、流程图、练习与原型都服务于项目推进。</text></g><text id="page" data-pptx-role="page-number" x="1232" y="691" text-anchor="end" font-size="14" fill="#617673">02 / 70</text></svg>
