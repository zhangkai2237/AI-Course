function editor(){const d=doc(),r=currentRun(),latest=r?.snapshot.task.docId===d.id?r:null,valid=validRun(latest,d);return header('CONTENT / SELF-CHECK','内容与自检','从一篇P1文案开始，把资料、判断与处理接起来。',button('查看审核链路','to-lab','',!latest?'disabled':''))+stats([['当前稿件','V'+d.v,dirty(d)?'有未保存修改':'正文已保存'],['本次检查',latest?latest.status==='running'?'运行中':latest.status==='incomplete'?'部分未完成':'已返回':'待检查','结果绑定发起时的版本'],['正式审核',S.tasks.find(t=>t.docId===d.id)?.status==='approved'?'已通过':S.tasks.some(t=>t.docId===d.id&&t.status==='pending')?'待人工审核':'尚未通过','人工决定单独记录'],['覆盖范围','3 个审核点','功能对象 / 价格条件 / 赠品权益']])+`<div class="grid"><section class="card"><div class="cardhead"><div><h2>编辑当前文案</h2><span class="tiny muted">${h(d.id)} · ${h(d.title)}</span></div>${S.docs.length>1?`<select id="doc-select" aria-label="选择文案">${S.docs.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${h(x.title)}</option>`).join('')}</select>`:badge('小周的工作区','green')}</div><div class="formgrid"><label class="field">商品规格<select id="sku"><option>P1标准版</option><option ${d.sku==='P1其他规格'?'selected':''}>P1其他规格</option></select></label><label class="field">关联活动<select id="activity"><option>P1十月活动</option><option ${d.activity==='另一独立活动'?'selected':''}>另一独立活动</option></select></label><label class="field wide">业务适用日期<input type="date" id="asof" value="${h(d.asOf)}"></label></div><div class="labelrow"><span>正文 <span class="muted" id="dirty-label">${dirty(d)?'· 有未保存修改':'· 已保存 V'+d.v}</span></span><span class="muted tiny">每次保存保留历史</span></div><textarea id="draft" class="editor" aria-label="文案正文">${h(d.draft)}</textarea><div class="toolbar">${[['initial','问题稿'],['partial','只补会员资格'],['complete','条件完整稿'],['boundary','边界表达'],['feature','纯功能稿'],['updated','权益更新稿']].map(([k,t])=>button(t,'sample','',`data-sample="${k}" ${S.role!=='author'?'disabled':''}`)).join('')}</div><div class="actions">${button('保存新版本','save','',busy?'':'')}${button(busy?'<span class="spin"></span>检查进行中':'发起自检','check','primary',busy?'disabled':'')}${button('提交正式审核','submit','',!valid||busy?'disabled':'')}</div><div class="versions">${d.versions.map(x=>`<span class="version">V${x.v} · ${x.time}</span>`).join('')}</div><div class="help">检查自动固定已保存正文。修改后请重新检查；正式提交不会把系统结果直接变成人工通过。</div></section><section class="card"><div class="cardhead"><div><h2>检查结果与依据</h2><span class="tiny muted">${latest?h(latest.id):'每条问题都可追溯'}</span></div>${latest?badge('V'+latest.snapshot.task.version):''}</div>${latest&&!valid&&latest.status!=='running'?`<div class="help warn">当前正文、商品活动或依据已变化。这份结果保留在原输入，不能用于直接确认当前稿。</div>`:''}${report(latest)}</section></div>`;}
function review(){const t=taskBy(S.taskId);if(!t)return header('REVIEW / TASKS','正式审核','先看提交版本与等待原因，再进入原句、依据和人工判断。')+`<div class="card tablecard"><div class="cardhead"><h2>审核任务</h2>${badge(S.tasks.filter(t=>t.status==='pending').length+' 项待审核','amber')}</div>${S.tasks.length?`<div class="tablewrap"><table><thead><tr><th>任务 / 稿件</th><th>提交版本</th><th>系统检查</th><th>人工审核</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${S.tasks.map(x=>`<tr><td><div class="rowtitle">${h(x.title)}</div><span class="tiny muted">${h(x.id)}</span></td><td>V${x.v}</td><td>${badge(runBy(x.runId)?.status==='incomplete'?'部分未完成':'已返回')}</td><td>${badge(({pending:'待人工审核',returned:'已退回',approved:'已通过'})[x.status],x.status==='approved'?'green':'amber')}</td><td>${x.created}</td><td>${button('进入任务','open-task','small',`data-id="${x.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('review')}<h3>还没有正式提交</h3><p>先在内容与自检页完成一次检查，再提交给审核员。也可在课堂控制中载入“正式审核”场景。</p>${button('进入内容与自检','nav','primary',`data-page="editor"`)}</div>`}</div>`;

function trace(r){const x=r.snapshot,src=E.matchSources(x),rules=x.config.rules,stale=!E.runnable(r,taskInput(S.docs.find(d=>d.id===x.task.docId)||doc()),S.config);const steps=[
 ['接收任务并固定版本',`正文V${x.task.version}，商品 ${x.task.sku}，活动 ${x.task.activity}，适用日 ${x.task.asOf}。`,{task:x.task,createdAt:x.createdAt}],
 ['按上下文取得有效资料',`采用${src.length}份资料：${src.map(s=>s.id+' v'+s.version).join('、')||'没有匹配资料'}。${x.config.giftEnded?'同时携带E-GIFT-01名额用完事件。':''}`,src],
 ['读取审核点与执行配置',`${rules.filter(q=>q.enabled).length}项启用。停用项保留“未完成”，不能悄悄排除必查范围。`,rules],
 ['执行确定性准备与语义核对',r.mode==='live'?'按系统约定发送完整正文、审核点与允许资料；没有配置或请求失败时显示未完成。':'本次使用固定课堂规则，不调用模型；程序演示金额路径，限定表达匹配辅助说明语义任务。',{mode:r.mode,priceCalculation:r.result?.preparation?.calculation||'金额由固定教学方案给出',model:r.result?.model||null,raw:r.result?.raw||{status:'running'}}],
 ['程序校验原句、结构和引用',r.result?.validation?.problems?.length?'有返回项未通过校验，已转为未完成。':'结构校验不能证明语义正确；审核人员仍需结合上下文确认。',r.result?.validation||{status:r.status}],
 ['保存结果并交人处理','检查关联原正文与依据。人工决定、作者改稿、复核和实际内容更新分别记录。',{runId:r.id,status:r.status,checks:r.result?.checks||[],staleToCurrent:stale}]
 ];return `<div class="grid"><section class="card"><div class="cardhead"><div><h2>${h(r.id)}</h2><span class="tiny muted">${r.started} → ${r.finished||'运行中'} · ${h(r.kind)}</span></div>${badge(liveLabel(r),r.mode==='live'?'green':'amber')}</div>${steps.map(([title,sub,data],i)=>`<div class="steptrace"><div class="stepcircle">${i+1}</div><div class="tracebody"><h3>${title}</h3><p>${h(sub)}</p><details ${i===0?'open':''}><summary>展开本步输入 / 输出</summary>${j(data)}</details></div></div>`).join('')}</section><aside class="stack"><div class="card"><h2>这条链路的业务含义</h2><dl class="twocol"><dt>服务哪篇稿件</dt><dd>${h(x.task.title)} · V${x.task.version}</dd><dt>凭什么判断</dt><dd>匹配SKU、活动和适用日后的有效资料</dd><dt>谁确认问题</dt><dd>审核员判断，业务负责人解释争议</dd><dt>修改后怎么办</dt><dd>保存新版，再对新版检查与复核</dd><dt>失败交给谁</dt><dd>补资料、重试或记录人工补核</dd></dl>${stale?'<div class="help warn">当前稿件或配置已变化。本次记录只保留原输入，不能替代新版本检查。</div>':''}</div><div class="card"><h2>课堂观察</h2><p class="smalltext muted">试着改为“只补会员资格”，观察R02还缺什么；切换活动后观察资料匹配；开启原句校验失败，观察结果如何转成未完成。</p><div class="actions">${button('课堂控制','controls')}${button('查看资料与审核点','nav','small',`data-page="sources"`)}</div></div></aside></div>`;}

function guide(){if(!S.teacher)return '';const tips={editor:['先看一条完整任务','先运行问题稿，展开依据；载入“只补会员资格”再次检查，观察价格条件还缺什么。'],review:['把检查结果接到人工工作','确认成立后退回；作者修改并重新提交，审核员复核新版。'],lab:['逐步打开链路','沿任务快照、有效资料、审核配置、执行输出和程序校验讲解；不要把结构正确当作结论正确。'],sources:['改变一个输入条件','关闭活动资料或调整有效期，再运行相同文案，观察受影响项与旧记录。'],inspection:['变化后，实际内容如何更新','巡检保留范围待核项；内容负责人认领，修订、复核后再核验实际位置。'],testing:['从结果走向下一次修改','先看参考判断与输出差异，再记录原因。修改后保留新旧结果和复测依据。']}[S.page];return `<div id="guide" class="callout"><div class="switchrow"><h3>${tips[0]}</h3>${badge('教师讲解提示','green')}</div><p>${tips[1]}</p></div>`;}
let previousPage=S.page;
function render(){if(previousPage!==S.page){window.scrollTo(0,0);previousPage=S.page;}const d=doc(),r=currentRun();document.querySelector('#app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="brandmark">净</div><div><strong>净小伴</strong><small>REVIEW WORKSPACE</small></div></div><div class="navcap">项目二 · 审核提效</div><nav class="nav" aria-label="主要功能">${Object.entries(PAGES).map(([k,v])=>`<button class="${S.page===k?'on':''}" data-action="nav" data-page="${k}">${icon(k)}${v}${k==='review'&&S.tasks.some(t=>t.status==='pending')?`<span class="count">${S.tasks.filter(t=>t.status==='pending').length}</span>`:''}</button>`).join('')}</nav><div class="navhint">第二次课 / 从方案到可执行链路</div><div class="sidebottom"><div class="sideline"></div><strong>依据清楚，处理有着落。</strong>自检提前准备<br>审核正式确认<br>巡检跟进实际更新<div style="margin-top:18px">${button('课堂控制','controls','small ghost')} ${button('导出记录','export','small ghost')}</div></div></aside><main><header class="top"><div class="crumb">内容工作空间 <span style="margin:0 9px">/</span> <strong>${PAGES[S.page]}</strong></div><div class="topright"><button class="small" data-action="settings">${icon('setting')} 模型连接</button><select id="mode" aria-label="运行模式"><option value="simulation" ${S.mode==='simulation'?'selected':''}>本地规则演示</option><option value="live" ${S.mode==='live'?'selected':''}>真实模型调用</option></select><div class="avatar">${ROLES[S.role].slice(-1)}</div><select id="role" aria-label="课堂角色">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${S.role===k?'selected':''}>${v}</option>`).join('')}</select>${button(S.teacher?'隐藏讲解':'显示讲解','guide','small')}</div></header><div class="modebar ${S.mode==='live'?'live':''}"><span><i class="dot"></i>${S.mode==='live'?'真实模型模式 · '+(server.config.configured?'已配置接口，运行时实际调用':'尚未配置接口，不能进行真实审核'):'课堂演示 · 本地规则执行，不调用模型'}</span><span>教学资料与角色模拟 / 仅覆盖3个审核点 / 不执行发布</span></div><div class="content">${!storageOK?'<div class="help warn">浏览器无法持久保存，请使用“导出记录”备份演示进度。</div>':''}${guide()}${({editor,review,lab,sources,inspection,testing}[S.page]||editor)()}<div class="foot">净小伴 P1 · 第二次课课堂Demo v1.0 · 商品、角色及业务资料为教学设定 · 浏览器本地保存</div></div></main></div>`;}
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='draft'){doc().draft=el.value;const label=document.querySelector('#dirty-label');if(label)label.textContent=dirty()?'· 有未保存修改':'· 已保存 V'+doc().v;save();}});
document.addEventListener('change',async ev=>{const el=ev.target;try{if(el.id==='role'){S.role=el.value;update();}else if(el.id==='mode'){if(busy){el.value=S.mode;return toast('检查运行中暂不能切换模式。');}S.mode=el.value;update();if(S.mode==='live'&&!server.config.configured)toast('真实模型尚未配置。失败会保留为未完成，不会替换成模拟结果。');}else if(['sku','activity','asof'].includes(el.id)){doc()[({sku:'sku',activity:'activity',asof:'asOf'})[el.id]]=el.value;log('变更业务上下文','旧检查保留，当前任务需重新匹配资料。');update();}else if(el.id==='doc-select'){S.docId=el.value;S.selectedRun=null;update();}else if(el.id==='run-select'){S.selectedRun=el.value;update();}else if(el.id==='fault'){S.fault=el.value;save();}else if(el.id==='delay'){S.delay=el.value==='slow';save();}else if(el.dataset.scope){S.scope=el.checked?[...new Set([...S.scope,el.dataset.scope])]:S.scope.filter(x=>x!==el.dataset.scope);save();}else if(el.dataset.sourceToggle){if(!need('curator'))return;const s=S.config.sources.find(s=>s.id===el.dataset.sourceToggle);s.enabled=el.checked;s.version++;log('确认资料状态变更',s.id+' v'+s.version+' · '+(s.enabled?'可用':'不可用'));update();}else if(el.dataset.ruleToggle){if(!need('curator'))return;const r=S.config.rules.find(r=>r.id===el.dataset.ruleToggle);r.enabled=el.checked;r.version++;log('更新审核点状态',r.id+' v'+r.version);update();}}catch(e){toast(e.message);}});
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;try{
 if(a==='nav'){S.page=el.dataset.page;if(S.page==='review')S.taskId=null;S.focus=null;update();}
 else if(a==='guide'){S.teacher=!S.teacher;update();}
 else if(a==='close')close();else if(a==='modal-save'){if(modalAction)await modalAction();}
 else if(a==='controls')controls();else if(a==='scene')await scene(el.dataset.id);else if(a==='settings')settings();else if(a==='save-config')await saveConfig();else if(a==='clear-config'){const r=await api('/api/config',{clear:true});server.config=r.config;close();update();toast('连接配置已从服务内存清除。');}
 else if(a==='sample'){if(!need('author'))return;doc().draft=E.SAMPLE[el.dataset.sample];update();toast('已载入教学稿；保存后将产生新版本。');}
 else if(a==='save'){if(need('author'))commit();}else if(a==='check')await check();else if(a==='submit')submit();
 else if(a==='to-lab'){S.page='lab';update();}else if(a==='open-run'){S.selectedRun=el.dataset.id;S.page='lab';update();}
 else if(a==='open-task'){S.taskId=el.dataset.id;S.page='review';S.focus=null;update();}else if(a==='task-list'){S.taskId=null;update();}
 else if(a==='edit-task'){const t=taskBy(S.taskId);S.docId=t.docId;S.page='editor';S.role='author';S.selectedRun=null;update();}
 else if(a==='recheck')await recheck();else if(a==='decision')decide(el.dataset.rule,el.dataset.kind);else if(a==='return')formal('return');else if(a==='approve')formal('approve');
 else if(a==='locate'){S.focus=el.dataset.rule;update();const r=runBy(el.dataset.run),c=r?.result?.checks.find(x=>x.ruleId===el.dataset.rule);const textarea=document.querySelector('#draft');if(textarea&&c?.position>=0&&validRun(r)){textarea.focus();textarea.setSelectionRange(c.position,c.position+c.quote.length);}document.querySelector('#original-text mark')?.scrollIntoView({block:'center',behavior:'smooth'});}
 else if(a==='gift')gift();else if(a==='batch')await batch();else if(a==='claim')claim(el.dataset.batch,el.dataset.asset);else if(a==='revise')revise(el.dataset.batch,el.dataset.asset);else if(a==='resolve-scope')resolveScope(el.dataset.batch,el.dataset.asset);else if(a==='finalize')finalize(el.dataset.batch,el.dataset.asset);
 else if(a==='edit-asset'){const d=S.docs.find(x=>x.assetId===el.dataset.asset);S.docId=d.id;S.page='editor';S.role='author';S.selectedRun=null;update();}
 else if(a==='rule-save'){if(!need('curator'))return;const r=S.config.rules.find(r=>r.id===el.dataset.id),v=document.querySelector('#instruction-'+r.id).value.trim();if(!v)return toast('审核说明不能为空。');if(v===r.instruction)return toast('审核说明未变化。');r.instruction=v;r.version++;log('确认审核点新版本',r.id+' v'+r.version+'；旧执行记录保留。');update();}
 else if(a==='source-date'){if(!need('curator'))return;const s=S.config.sources.find(s=>s.id===el.dataset.id);modal('调整资料有效期',`<p class="muted smalltext">${h(s.id)} v${s.version}，确认后保存新版本。</p><div class="formgrid"><label class="field">生效日期<input type="date" id="source-from" value="${s.from}"></label><label class="field">失效日期<input type="date" id="source-to" value="${s.to}"></label></div><div class="actions" style="margin-top:20px">${button('确认变更','modal-save','primary')}</div>`,()=>{const from=document.querySelector('#source-from').value,to=document.querySelector('#source-to').value;if(!from||!to||from>to)return toast('请填写有效的起止日期。');s.from=from;s.to=to;s.version++;log('确认资料有效期',s.id+' v'+s.version+' · '+from+'至'+to);close();update();});}
 else if(a==='tests')await tests();else if(a==='badcase')badcase(el.dataset.id);else if(a==='retest')retest(el.dataset.id);
 else if(a==='reset'){if(busy)return toast('检查进行中，请等待结束后重置。');ask('重置本地课堂进度','本操作清空此浏览器中的稿件、任务、巡检和测试记录，可先导出备份。',()=>{S=seed();close();update();});}
 else if(a==='export'){const exportData={...copy(S),exportedAt:new Date().toISOString(),notice:'课堂记录，无API密钥；包含教学模拟或真实模型结果，请按每条运行模式区分。'};const b=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),link=document.createElement('a');link.href=url;link.download='第二次课_审核链路课堂记录.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('课堂记录已导出，不含模型密钥。');}
 }catch(error){busy=false;toast('操作未完成：'+error.message);console.error(error);}});
render();connect().then(()=>render());
// Restored in-flight runs cannot resume after a browser refresh.
for(const r of S.runs){if(r.status==='running'){r.status='incomplete';r.error='页面重载，中断的检查未完成，请重新运行。';r.result={engine:r.mode,checks:r.snapshot.config.rules.map(x=>({ruleId:x.id,status:'incomplete',reason:r.error,quote:'',sourceId:'',evidence:''})),raw:{error:r.error}};}}save();render();
})();
</script></body></html>
