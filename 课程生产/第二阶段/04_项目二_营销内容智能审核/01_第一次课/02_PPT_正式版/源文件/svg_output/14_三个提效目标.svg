<g id="goal-evidence" data-pptx-bounds="48 190 1184 115"><text x="48" y="249" font-size="64" fill="#DBAB4A">01</text><text x="185" y="245" font-size="32" fill="#FFFFFF" font-weight="bold">依据来到原句旁</text><text x="185" y="292" font-size="28" fill="#E8F2EF">作者与审核人员，少重复查找、定位和整理材料</text></g>
<g id="goal-revision" data-pptx-bounds="48 325 1184 115"><text x="48" y="384" font-size="64" fill="#DBAB4A">02</text><text x="185" y="380" font-size="32" fill="#FFFFFF" font-weight="bold">意见具体，复核接得上</text><text x="185" y="427" font-size="28" fill="#E8F2EF">少解释同一个问题，少重连旧意见与新版本</text></g>
