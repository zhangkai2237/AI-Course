<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F7F8F4"/>
<g id="header" data-pptx-bounds="48 32 1184 125"><text x="48" y="62" font-size="20" fill="#126B63">第二篇·做方案 / 6.3 页面、权限与异常</text><text x="48" y="125" font-size="42" font-weight="bold" fill="#17302F">每个异常，都要回答“现在怎样、下一步谁做”</text></g>
<g id="missing" data-pptx-bounds="48 192 1184 112"><rect x="48" y="192" width="1184" height="112" rx="12" fill="#FFFFFF"/><text x="76" y="235" font-size="28" font-weight="bold" fill="#D85C3D">缺活动资料</text><text x="370" y="235" font-size="28" fill="#17302F">价格、赠品检查未完成 → 补充有效资料</text><text x="370" y="282" font-size="24" fill="#617673">提交人或活动负责人承接，不能显示完整审核完成</text></g>
<g id="timeout" data-pptx-bounds="48 335 1184 112"><rect x="48" y="335" width="1184" height="112" rx="12" fill="#E8F2EF"/><text x="76" y="378" font-size="28" font-weight="bold" fill="#D85C3D">部分超时</text><text x="370" y="378" font-size="28" fill="#17302F">保留已完成项 → 重试或人工补核</text><text x="370" y="425" font-size="24" fill="#617673">明确人工核对范围与依据，重试继续关联原任务版本</text></g>
<g id="unowned" data-pptx-bounds="48 478 1184 112"><rect x="48" y="478" width="1184" height="112" rx="12" fill="#FFFFFF"/><text x="76" y="521" font-size="28" font-weight="bold" fill="#D85C3D">状态不明或无人接收</text><text x="370" y="521" font-size="28" fill="#17302F">待确认、待承接 → 负责人协调</text><text x="370" y="568" font-size="24" fill="#617673">不按已处理关闭；重复提交避免重复正式流转</text></g>
<g id="principle" data-pptx-bounds="48 616 1184 37"><text x="48" y="644" font-size="24" fill="#126B63">失败可见，范围可见，责任可见。资料冲突时带证据与版本交人确认。</text></g><g id="course-nav" data-pptx-bounds="0 660 1280 60"><rect x="0" y="660" width="1280" height="60" fill="#FFFFFF"/><line x1="48" y1="660" x2="1232" y2="660" stroke="#D3DFDA"/>
